name: Apps Script Sync

on:
  push:
    branches:
      - main
    paths:
      - "apps-script/**/*.js"
      - "apps-script/**/*.json"
      - ".github/workflows/apps-script-sync.yml"
      - "!apps-script/.clasp.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push-to-apps-script:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps-script

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install clasp
        run: npm install -g @google/clasp@3.4.1

      - name: Configurar autorizacao Google
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON" || (echo "Secret CLASPRC_JSON nao configurado" && exit 1)
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Configurar projeto Apps Script
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          test -n "$APPS_SCRIPT_ID" || (echo "Secret APPS_SCRIPT_ID nao configurado" && exit 1)
          printf '{"scriptId":"%s","rootDir":"."}\n' "$APPS_SCRIPT_ID" > .clasp.json

      - name: Enviar codigo para Apps Script
        run: clasp push --force

      - name: Criar novo deployment Web App
        run: clasp deploy --description "Recovery deploy GitHub ${{ github.sha }}"
