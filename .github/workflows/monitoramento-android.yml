name: Widget Android - Monitoramento RF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'monitoramento/android/**'
      - '.github/workflows/monitoramento-android.yml'

permissions:
  contents: write

concurrency:
  group: widget-android-rf
  cancel-in-progress: false

jobs:
  construir-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Android SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" -type f | sort -V | tail -n 1)
          echo "Android SDK Manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar APK
        run: gradle --no-daemon -p monitoramento/android :app:assembleDebug
      - name: Preparar APK
        run: cp monitoramento/android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/MonitoramentoRF.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: MonitoramentoRF-APK
          path: ${{ runner.temp }}/MonitoramentoRF.apk
          retention-days: 90
      - name: Publicar APK para download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="widget-android-${GITHUB_SHA:0:12}"
          gh release create "$TAG" "$RUNNER_TEMP/MonitoramentoRF.apk" \
            --title "Monitoramento RF - Widget Android" \
            --notes "Widget Android para as APIs da Consultoria RF. Baixe MonitoramentoRF.apk e instale no celular. APK de teste assinado com certificado de debug."
