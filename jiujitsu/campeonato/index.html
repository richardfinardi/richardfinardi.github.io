<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jiu-Jitsu | Campeonato</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f4f4f5;font:16px system-ui}main{max-width:1200px;margin:auto;padding:20px}a{color:#9ca3af}h1,h2{margin:12px 0}input,textarea,select,button{font:inherit;border:1px solid #41464f;border-radius:8px;padding:12px;background:#20242b;color:white}button{cursor:pointer;font-weight:600}button:disabled{opacity:.4;cursor:default}textarea{width:100%;min-height:140px}section{background:#15191f;border:1px solid #30343c;border-radius:14px;padding:16px;margin:16px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.bracket{display:flex;gap:22px;overflow:auto;padding:12px 0}.round{min-width:230px;display:flex;flex-direction:column;justify-content:space-around;gap:12px}.match{text-align:left;white-space:pre-line;min-height:100px}.green{background:#17643b}.red{background:#842c35}.score{font-size:clamp(48px,12vw,110px);font-weight:800}.clock{font-size:clamp(55px,12vw,110px);font-variant-numeric:tabular-nums;font-weight:800;text-align:center}.sides{display:grid;grid-template-columns:1fr 1fr;gap:10px}.side{padding:14px;border-radius:12px;background:#20242b;min-width:0;overflow-wrap:anywhere}.side:first-child{background:#153c29}.side button{padding:9px;margin:3px}.muted{color:#a1a1aa}.winner{border-color:#34d399}dialog{background:#11151b;color:white;border:1px solid #444;border-radius:12px;width:min(960px,98vw);max-height:96vh;overflow:auto}dialog::backdrop{background:#000b}[hidden]{display:none!important}@media(max-width:500px){main{padding:10px}.side{padding:8px}.side button{font-size:12px;padding:8px}}
</style><main><a href="../">← Jiu-Jitsu</a><h1>Campeonato</h1><div class="row"><select id="events"></select><button id="newEvent">Novo campeonato</button></div><section id="setup"><h2>Montar chave</h2><input id="category" placeholder="Categoria / faixa / peso"><p>Informe um lutador por linha.</p><textarea id="names" placeholder="Nome do lutador"></textarea><div class="row"><button id="generate" class="green">Sortear e fechar chave</button></div></section><section><h2>Chaves</h2><div id="keys"></div></section><p class="muted">Dados salvos neste navegador. Formato eliminatório simples.</p></main><dialog id="board"><div class="row"><button id="close">Voltar à chave</button><button id="full">Tela cheia</button><span id="matchTitle"></span></div><div class="row"><label>Minutos <input id="mins" type="number" min="0" max="120" value="5" style="width:85px"></label><label>Segundos <input id="secs" type="number" min="0" max="59" value="0" style="width:80px"></label><button id="apply">Definir tempo</button></div><div class="clock" id="clock">05:00</div><div class="row" style="justify-content:center"><button id="start" class="green">Iniciar</button><button id="pause">Pausar</button><button id="reset">Reiniciar tempo</button></div><div class="sides" id="sides"></div><div class="row"><label>Resultado <select id="reason"><option>Pontos</option><option>Finalização</option><option>Decisão do árbitro</option><option>Desclassificação</option><option>W.O.</option></select></label></div></dialog><script>
const $=id=>document.getElementById(id), storage='bjj-campeonato-v1';let db;try{db=JSON.parse(localStorage.getItem(storage))||{events:[],current:null}}catch{db={events:[],current:null}}let active=null;const save=()=>localStorage.setItem(storage,JSON.stringify(db));const event=()=>db.events.find(e=>e.id===db.current);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const score=()=>({p:0,v:0,f:0});function match(a,b){return {a,b,w:null,reason:null,s:[score(),score()],duration:300000,left:300000,end:null}}
function advance(k){for(let r=0;r<k.rounds.length;r++){for(let i=0;i<k.rounds[r].length;i++){let m=k.rounds[r][i];if(r===0&&!m.w&&((m.a&&!m.b)||(!m.a&&m.b))){m.w=m.a||m.b;m.reason='BYE'}if(m.w&&r+1<k.rounds.length){let n=k.rounds[r+1][Math.floor(i/2)];n[i%2?'b':'a']=m.w}}}}
function render(){let e=event();$('events').innerHTML=db.events.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');$('events').value=db.current||'';$('setup').hidden=!e;$('keys').innerHTML='';if(!e)return;for(let [ki,k] of e.keys.entries()){let section=document.createElement('section');section.innerHTML='<h2>'+esc(k.name)+'</h2>';let br=document.createElement('div');br.className='bracket';k.rounds.forEach((round,r)=>{let col=document.createElement('div');col.className='round';let label=document.createElement('b');label.textContent=r===k.rounds.length-1?'Final':r===k.rounds.length-2?'Semifinal':r===k.rounds.length-3?'Quartas de final':'Rodada '+(r+1);col.append(label);round.forEach((m,i)=>{let b=document.createElement('button');b.className='match'+(m.w?' winner':'');b.disabled=!m.a||!m.b||!!m.w;b.textContent='Luta '+(i+1)+'\n'+(m.a||'A definir')+'  '+m.s[0].p+'\n'+(m.b||'A definir')+'  '+m.s[1].p+(m.w?'\nVencedor: '+m.w+' ('+m.reason+')':'');b.onclick=()=>open(ki,r,i);col.append(b)});br.append(col)});section.append(br);let champion=k.rounds.at(-1)[0].w;if(champion){let p=document.createElement('h2');p.textContent='Campeão: '+champion;section.append(p)}$('keys').append(section)}}
$('newEvent').onclick=()=>{let name=prompt('Nome do campeonato');if(!name?.trim())return;let id=String(Date.now());db.events.push({id,name:name.trim(),keys:[]});db.current=id;save();render()};$('events').onchange=()=>{db.current=$('events').value;save();render()};$('generate').onclick=()=>{let names=$('names').value.split(/\n/).map(x=>x.trim()).filter(Boolean),name=$('category').value.trim();if(!name||names.length<2||names.length>128||new Set(names.map(x=>x.toLowerCase())).size!==names.length)return alert('Informe a categoria e de 2 a 128 nomes distintos.');if(!confirm('Fechar a chave e sortear os confrontos?'))return;for(let i=names.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[names[i],names[j]]=[names[j],names[i]]}let size=2**Math.ceil(Math.log2(names.length)),first=[],byes=size-names.length;for(let i=0;i<size/2;i++)first.push(match(names.shift(),i<byes?null:names.shift()));let rounds=[first];for(let n=size/4;n>=1;n/=2)rounds.push(Array.from({length:n},()=>match(null,null)));let k={name,rounds};advance(k);event().keys.push(k);save();$('names').value='';$('category').value='';render()};
function current(){return active&&event().keys[active[0]].rounds[active[1]][active[2]]}function remaining(m){return Math.max(0,m.end?m.end-Date.now():m.left)}function tick(){let m=current();if(!m)return;let ms=remaining(m);if(!ms&&m.end){m.end=null;m.left=0;save()}let t=Math.ceil(ms/1000);$('clock').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');$('start').disabled=!!m.end||!ms;$('pause').disabled=!m.end;$('apply').disabled=!!m.end}
function open(k,r,i){active=[k,r,i];let m=current();$('matchTitle').textContent=event().keys[k].name+' · Luta '+(i+1);$('mins').value=Math.floor(m.duration/60000);$('secs').value=m.duration/1000%60;draw();tick();$('board').showModal()}
function draw(){let m=current();$('sides').innerHTML='';[m.a,m.b].forEach((name,i)=>{let d=document.createElement('div');d.className='side';let s=m.s[i];d.innerHTML='<h2>'+esc(name)+'</h2><div class="score">'+s.p+'</div><div>Vantagens: '+s.v+' | Punições: '+s.f+'</div>';for(let [label,key,v] of [['+2 Queda / raspagem / joelho','p',2],['+3 Passagem','p',3],['+4 Montada / costas','p',4],['−1 ponto','p',-1],['+ Vantagem','v',1],['− Vantagem','v',-1],['+ Punição','f',1],['− Punição','f',-1]]){let b=document.createElement('button');b.textContent=label;b.onclick=()=>{s[key]=Math.max(0,s[key]+v);save();draw()};d.append(b)}let b=document.createElement('button');b.className='green';b.textContent='Declarar vencedor';b.onclick=()=>{let reason=$('reason').value;if(!confirm('Confirmar vitória de '+name+' por '+reason+'?'))return;m.left=remaining(m);m.end=null;m.w=name;m.reason=reason;advance(event().keys[active[0]]);save();$('board').close()};d.append(b);$('sides').append(d)})}
$('apply').onclick=()=>{let m=current(),a=Number($('mins').value),b=Number($('secs').value);if(!Number.isInteger(a)||!Number.isInteger(b)||a<0||a>120||b<0||b>59||a+b===0)return alert('Tempo inválido');if(!confirm('Definir novo tempo da luta?'))return;m.duration=m.left=(a*60+b)*1000;m.end=null;save();tick()};$('start').onclick=()=>{let m=current();if(!m.end&&m.left>0){m.end=Date.now()+m.left;save();tick()}};$('pause').onclick=()=>{let m=current();m.left=remaining(m);m.end=null;save();tick()};$('reset').onclick=()=>{if(!confirm('Reiniciar o cronômetro?'))return;let m=current();m.left=m.duration;m.end=null;save();tick()};$('close').onclick=()=>$('board').close();$('board').onclose=()=>{active=null;render()};$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else $('board').requestFullscreen?.().catch(()=>{})};setInterval(tick,150);render();
</script></html>
