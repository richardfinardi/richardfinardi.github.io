<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<link rel="icon" href="./tega-icon-192.svg?v=8" type="image/svg+xml">
<link rel="apple-touch-icon" href="./tega-icon-192.svg?v=8">
<title>Jiu-Jitsu | Treinos & Evolução</title>
<link rel="manifest" href="./manifest.json?v=8">
<link rel="stylesheet" href="./styles.css?v=8">
</head>
<body>
<header class="top">
  <div class="brand"><img class="app-logo" src="./tega-icon-192.svg?v=7" alt="TEGA Jiu-Jitsu"><div><span class="eyebrow">MEU JIU-JITSU</span><h1>Treinos & evolução</h1></div></div>
  <button id="btnInstall" class="ghost" hidden>Instalar</button>
</header>
<main>
<section id="viewResumo" class="view active">
  <section class="quick-actions"><button id="btnNovoTreino" class="primary quick">＋ Registrar treino</button></section>
  <section class="cards">
    <article><small>Treinos</small><strong id="kpiTotal">—</strong><span>Total registrado</span></article>
    <article><small>Este mês</small><strong id="kpiMes">—</strong><span>Treinos realizados</span></article>
    <article><small>Faixa atual</small><strong id="kpiFaixa">—</strong><span id="kpiDiasFaixa">—</span></article>
    <article><small>Grau atual</small><strong id="kpiGrau">—</strong><span id="kpiDiasGrau">—</span></article>
    <article><small>Este ano</small><strong id="kpiAno">—</strong><span>Treinos realizados</span></article>
    <article><small>NOGI</small><strong id="kpiNogi">—</strong><span id="kpiNogiPct">—</span></article>
  </section>
  <section class="panel"><div class="panel-head"><h2>Treinos por mês</h2><span id="anoGrafico" class="muted"></span></div><div id="graficoMes" class="bars"></div></section>
  <section class="panel"><div class="panel-head"><h2>GI x NOGI</h2></div><div id="tipoResumo"></div></section>
  <section class="panel"><div class="panel-head"><h2>Locais</h2></div><div id="locaisResumo" class="stats-list"></div></section>
  <section class="panel"><div class="panel-head"><h2>Por ano</h2></div><div id="anosResumo" class="stats-list"></div></section>
</section>

<section id="viewTreinos" class="view">
  <section class="panel">
    <div class="panel-head"><h2 id="formTitulo">Novo treino</h2><button id="btnCancelarEdicao" class="ghost small" hidden>Cancelar</button></div>
    <form id="formTreino">
      <input type="hidden" id="treinoId">
      <label>Data<input id="data" type="date" required></label>
      <label>Local<input id="local" value="TEGA" required></label>
      <label>Tipo<select id="tipo"><option value="GI">GI</option><option value="NOGI">NOGI</option></select></label>
      <label>Observação<input id="obs" placeholder="Opcional"></label>
      <button type="submit" class="primary">Salvar treino</button>
    </form>
    <p id="status" class="status"></p>
  </section>
  <section class="panel">
    <div class="panel-head"><h2>Histórico</h2><span id="qtdFiltrada" class="muted"></span></div>
    <div class="history-filters">
      <input id="filtroBusca" type="search" placeholder="Pesquisar local, tipo, observação ou data">
      <div class="filter-grid">
        <label>Ano<select id="filtroAno"></select></label>
        <label>Mês<select id="filtroMes">
          <option value="">Todos</option><option value="01">Janeiro</option><option value="02">Fevereiro</option>
          <option value="03">Março</option><option value="04">Abril</option><option value="05">Maio</option>
          <option value="06">Junho</option><option value="07">Julho</option><option value="08">Agosto</option>
          <option value="09">Setembro</option><option value="10">Outubro</option><option value="11">Novembro</option><option value="12">Dezembro</option>
        </select></label>
        <label>Tipo<select id="filtroTipo"><option value="">Todos</option><option value="GI">GI</option><option value="NOGI">NOGI</option></select></label>
        <label>Local<select id="filtroLocal"><option value="">Todos</option></select></label>
      </div>
      <button id="btnLimparFiltros" class="ghost full" type="button">Limpar filtros</button>
    </div>
    <div id="historico" class="list"></div>
    <button id="btnMais" class="ghost full" hidden>Carregar mais</button>
  </section>
</section>

<section id="viewEvolucao" class="view">
  <section class="panel belt-panel">
    <small class="muted">FAIXA ATUAL</small>
    <div class="belt-title"><strong id="evoFaixa">—</strong><span id="evoGrau" class="pill">—</span></div>
    <div id="evoFaixaDesde" class="muted"></div>
    <div id="evoGrauDesde" class="muted"></div>
  </section>
  <section class="panel">
    <div class="panel-head"><h2 id="gradTitulo">Registrar graduação</h2><button id="btnCancelarGrad" class="ghost small" hidden>Cancelar</button></div>
    <form id="formGrad">
      <input type="hidden" id="gradRow">
      <label>Faixa<select id="gradFaixa"><option>BRANCA</option><option>AZUL</option><option>ROXA</option><option>MARROM</option><option>PRETA</option></select></label>
      <label>Marco<select id="gradGrau"><option>INÍCIO</option><option>1º GRAU</option><option>2º GRAU</option><option>3º GRAU</option><option>4º GRAU</option></select></label>
      <label class="wide">Data<input id="gradData" type="date" required></label>
      <button type="submit" class="primary">Salvar graduação</button>
    </form>
    <p id="statusGrad" class="status"></p>
  </section>
  <section class="panel"><div class="panel-head"><h2>Linha do tempo</h2></div><div id="graduacoes" class="timeline"></div></section>
  <section class="panel"><div class="panel-head"><h2>Treinos por faixa</h2></div><div id="faixasResumo" class="stats-list"></div></section>
</section>
</main>
<nav class="bottom">
  <button data-view="Resumo" class="active">Resumo</button>
  <button data-view="Treinos">Treinos</button>
  <button data-view="Evolucao">Evolução</button>
</nav>
<script src="./config.js?v=8"></script>
<script src="./app.js?v=8"></script>
</body>
</html>
