<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Níveis de acesso | Consultoria RF</title>
<style>
:root{font-family:system-ui,Segoe UI,Arial,sans-serif;color:#203047;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#122543;color:white;padding:20px max(20px,calc((100vw - 1400px)/2));border-bottom:3px solid #15a58e}header a{color:#b7e8e1;text-decoration:none;font-size:12px}h1{margin:6px 0 0;font-size:23px}main{max-width:1440px;margin:auto;padding:24px 20px}.toolbar,.panel,.stat{background:white;border:1px solid #dce4ee;border-radius:13px;padding:17px}.toolbar{display:grid;grid-template-columns:2fr repeat(3,minmax(130px,1fr)) auto auto;gap:12px;align-items:end}label{display:block;font-size:12px;font-weight:700;color:#54647a;margin-bottom:5px}input,select,button{font:inherit}input,select{width:100%;height:40px;padding:8px 10px;border:1px solid #ccd7e4;border-radius:8px;background:white;color:#203047}button{height:40px;padding:0 15px;border:0;border-radius:8px;background:#122543;color:white;font-weight:700;cursor:pointer}.secondary{background:#e9f0f5;color:#203047}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:15px 0}.stat strong{font-size:25px;display:block;color:#122543}.stat span{font-size:12px;color:#69778b}.panel{padding:0;overflow:hidden}.panelhead{display:flex;justify-content:space-between;align-items:center;padding:14px 17px;gap:10px}.panelhead h2{margin:0;font-size:16px}.scroll{overflow:auto;max-height:65vh}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:10px 13px;border-bottom:1px solid #edf0f5;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#eaf0f6;cursor:pointer;z-index:1}tr:hover td{background:#f6fafc}.badge{display:inline-block;padding:4px 8px;border-radius:7px;background:#e7f2f0;color:#14735f;font-weight:700;font-size:11px}.muted{color:#75849a}.message{padding:12px 0;color:#62748c;font-size:12px}.error{color:#b63842}.count{font-size:12px;color:#718098}@media(max-width:1000px){.toolbar{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.toolbar{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:12px}header{padding:17px 20px}}
</style></head><body><header><a href="../">← Visões</a><h1>Columbia · Níveis de acesso</h1></header>
<main><div class="toolbar">
<div><label for="search">Pesquisar em todos os campos</label><input id="search" placeholder="Usuário, módulo, cargo, nível..."></div>
<div><label for="user">Usuário</label><select id="user"><option value="">Todos</option></select></div>
<div><label for="module">Módulo</label><select id="module"><option value="">Todos</option></select></div>
<div><label for="level">Nível de acesso</label><select id="level"><option value="">Todos</option></select></div>
<button id="refresh">Atualizar</button><button class="secondary" id="export">Exportar Excel</button></div>
<div class="stats"><div class="stat"><strong id="total">0</strong><span>Permissões exibidas</span></div><div class="stat"><strong id="users">0</strong><span>Usuários</span></div><div class="stat"><strong id="modules">0</strong><span>Módulos</span></div><div class="stat"><strong id="levels">0</strong><span>Níveis distintos</span></div></div>
<div class="panel"><div class="panelhead"><h2>Permissões por usuário e módulo</h2><span class="count" id="count"></span></div><div class="scroll"><table><thead><tr><th data-key="codigo">Código ↕</th><th data-key="usuario">Usuário ↕</th><th data-key="cod_modulo">Cód. módulo ↕</th><th data-key="modulo">Módulo ↕</th><th data-key="nivel_acesso">Nível de acesso ↕</th><th data-key="cargo">Cargo ↕</th></tr></thead><tbody id="rows"></tbody></table></div></div><p class="message" id="message" role="status">Carregando permissões...</p></main>
<script>
(()=>{'use strict';
const ENDPOINT='https://columbia.consultoriarf.net/niveis';
const $=id=>document.getElementById(id),fields=['codigo','usuario','cod_modulo','modulo','nivel_acesso','cargo'];
let data=[],filtered=[],sortKey='usuario',sortDir=1;
function normalize(r){
 const userKey=Object.keys(r).find(k=>/^usu/i.test(k) && !/cod|id|senha|nivel|permiss|tipo/i.test(k));
 const userValue=userKey?r[userKey]:'';
 return {
  codigo:r.codigo??'',
  usuario:String(userValue??r.usuario??r.nome_usuario??r.nome??'').trim(),
  cod_modulo:r.cod_modulo??'',
  modulo:r.modulo??'',
  nivel_acesso:r.nivel_acesso??'',
  cargo:r.cargo??''
 };
}
function unique(key){return [...new Set(data.map(r=>String(r[key]??'')).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR',{numeric:true}))}
function options(id,key){const select=$(id),current=select.value,values=unique(key);select.replaceChildren(new Option('Todos',''),...values.map(v=>new Option(v,v)));select.value=values.includes(current)?current:''}
function render(){const q=$('search').value.trim().toLocaleLowerCase('pt-BR');filtered=data.filter(r=>(!$('user').value||r.usuario===$('user').value)&&(!$('module').value||r.modulo===$('module').value)&&(!$('level').value||r.nivel_acesso===$('level').value)&&(!q||fields.some(k=>String(r[k]).toLocaleLowerCase('pt-BR').includes(q))));filtered.sort((a,b)=>sortDir*String(a[sortKey]).localeCompare(String(b[sortKey]),'pt-BR',{numeric:true}));const body=$('rows');body.replaceChildren();const frag=document.createDocumentFragment();for(const r of filtered){const tr=document.createElement('tr');for(const key of fields){const td=document.createElement('td');if(key==='nivel_acesso'){const badge=document.createElement('span');badge.className='badge';badge.textContent=r[key];td.append(badge)}else{td.textContent=r[key];if(!r[key])td.className='muted'}tr.append(td)}frag.append(tr)}body.append(frag);$('total').textContent=filtered.length.toLocaleString('pt-BR');$('users').textContent=new Set(filtered.map(r=>r.usuario)).size;$('modules').textContent=new Set(filtered.map(r=>r.modulo)).size;$('levels').textContent=new Set(filtered.map(r=>r.nivel_acesso)).size;$('count').textContent=filtered.length+' de '+data.length+' registros'}
async function load(){$('refresh').disabled=true;$('message').className='message';$('message').textContent='Atualizando dados...';try{const res=await fetch(ENDPOINT,{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const json=await res.json();const arr=Array.isArray(json)?json:Array.isArray(json.dados)?json.dados:Array.isArray(json.resultados)?json.resultados:Array.isArray(json.items)?json.items:null;if(!arr)throw Error('Formato de resposta não reconhecido');data=arr.map(normalize);options('user','usuario');options('module','modulo');options('level','nivel_acesso');render();$('message').textContent='Dados atualizados em '+new Date().toLocaleString('pt-BR')}catch(e){$('message').className='message error';$('message').textContent='Falha ao consultar a API: '+e.message+'. Verifique a disponibilidade do endpoint e a liberação de CORS para consultoriarf.net.'}finally{$('refresh').disabled=false}}
for(const id of ['search','user','module','level'])$(id).addEventListener(id==='search'?'input':'change',render);
document.querySelectorAll('th[data-key]').forEach(th=>th.addEventListener('click',()=>{const key=th.dataset.key;sortDir=sortKey===key?-sortDir:1;sortKey=key;render()}));
$('refresh').addEventListener('click',load);
$('export').addEventListener('click',()=>{const header=['Código','Usuário','Cód. módulo','Módulo','Nível de acesso','Cargo'];const esc=s=>'"'+String(s??'').replaceAll('"','""')+'"';const csv='\uFEFF'+[header.map(esc).join(';'),...filtered.map(r=>fields.map(k=>esc(r[k])).join(';'))].join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=window.URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='columbia_niveis_acesso.csv';a.click();window.URL.revokeObjectURL(url)});
load();
})();
</script></body></html>
