<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auvrion | Gestão de Projetos</title><link rel="stylesheet" href="style.css"></head><body>
<header><strong>AUVRION</strong><span>Gestão de Projetos</span></header>
<div class="app"><nav><button data-view="painel">Painel</button><button data-view="clientes">Clientes</button><button data-view="projetos">Projetos</button><button data-view="equipe">Equipe</button></nav><main id="content"></main></div>
<script>
const K={clientes:"auvrion_clientes",projetos:"auvrion_projetos",equipe:"auvrion_equipe"};
const load=k=>JSON.parse(localStorage.getItem(K[k])||"[]"), save=(k,v)=>localStorage.setItem(K[k],JSON.stringify(v));
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function painel(){let c=load("clientes"),p=load("projetos"),e=load("equipe"),at=p.filter(x=>x.status!=="Concluído").length;return '<section><h1>Painel</h1><div class="kpis"><article><b>'+c.length+'</b><span>Clientes</span></article><article><b>'+p.length+'</b><span>Projetos</span></article><article><b>'+at+'</b><span>Em andamento</span></article><article><b>'+e.length+'</b><span>Equipe</span></article></div><h2>Projetos recentes</h2>'+tableProjetos(p.slice(-5).reverse())+'</section>'}
function clientes(){let a=load("clientes");return '<section><div class="title"><div><h1>Clientes</h1><p>Cadastro de clientes da Auvrion</p></div><button onclick="formCliente()">+ Novo cliente</button></div><div id="form"></div><div class="list">'+(a.length?a.map((x,i)=>'<article><div><b>'+esc(x.nome)+'</b><span>'+esc(x.contato||"Sem contato")+'</span></div><button class="ghost" onclick="formCliente('+i+')">Editar</button></article>').join(""):'<p class="empty">Nenhum cliente cadastrado.</p>')+'</div></section>'}
function formCliente(i){let a=load("clientes"),x=a[i]||{};document.querySelector("#form").innerHTML='<form onsubmit="salvarCliente(event,'+(i??-1)+')"><input name="nome" required placeholder="Nome do cliente" value="'+esc(x.nome||"")+'"><input name="contato" placeholder="Contato" value="'+esc(x.contato||"")+'"><button>Salvar</button></form>'}
function salvarCliente(e,i){e.preventDefault();let a=load("clientes"),o=Object.fromEntries(new FormData(e.target));i>=0?a[i]=o:a.push(o);save("clientes",a);render("clientes")}
function projetos(){let p=load("projetos");return '<section><div class="title"><div><h1>Projetos</h1><p>Escopo, responsáveis, prazo e andamento</p></div><button onclick="formProjeto()">+ Novo projeto</button></div><div id="form"></div>'+tableProjetos(p,true)+'</section>'}
function tableProjetos(p,edit=false){return p.length?'<div class="table"><div class="tr th"><span>Projeto</span><span>Cliente</span><span>Prazo</span><span>Status</span><span>%</span></div>'+p.map((x,i)=>'<div class="tr '+(edit?'click':'')+'" '+(edit?'onclick="formProjeto('+i+')"':'')+'><span>'+esc(x.nome)+'</span><span>'+esc(x.cliente)+'</span><span>'+esc(x.prazo||"-")+'</span><span>'+esc(x.status||"Planejamento")+'</span><span>'+esc(x.andamento||0)+'%</span></div>').join("")+'</div>':'<p class="empty">Nenhum projeto cadastrado.</p>'}
function formProjeto(i){let a=load("projetos"),x=a[i]||{},cs=load("clientes");document.querySelector("#form").innerHTML='<form class="grid" onsubmit="salvarProjeto(event,'+(i??-1)+')"><input name="nome" required placeholder="Nome do projeto" value="'+esc(x.nome||"")+'"><select name="cliente" required><option value="">Cliente</option>'+cs.map(c=>'<option '+(x.cliente===c.nome?'selected':'')+'>'+esc(c.nome)+'</option>').join("")+'</select><input name="responsavel" placeholder="Responsável" value="'+esc(x.responsavel||"")+'"><input type="date" name="prazo" value="'+esc(x.prazo||"")+'"><select name="status"><option>Planejamento</option><option '+(x.status==="Em andamento"?"selected":"")+'>Em andamento</option><option '+(x.status==="Concluído"?"selected":"")+'>Concluído</option></select><input type="number" min="0" max="100" name="andamento" placeholder="% andamento" value="'+esc(x.andamento||0)+'"><textarea name="escopo" placeholder="Escopo do projeto">'+esc(x.escopo||"")+'</textarea><button>Salvar projeto</button></form>'}
function salvarProjeto(e,i){e.preventDefault();let a=load("projetos"),o=Object.fromEntries(new FormData(e.target));i>=0?a[i]=o:a.push(o);save("projetos",a);render("projetos")}
function equipe(){let a=load("equipe");return '<section><div class="title"><div><h1>Equipe</h1><p>Pessoas envolvidas nos projetos</p></div><button onclick="formEquipe()">+ Nova pessoa</button></div><div id="form"></div><div class="list">'+(a.length?a.map((x,i)=>'<article><div><b>'+esc(x.nome)+'</b><span>'+esc(x.funcao||"")+'</span></div><button class="ghost" onclick="formEquipe('+i+')">Editar</button></article>').join(""):'<p class="empty">Nenhuma pessoa cadastrada.</p>')+'</div></section>'}
function formEquipe(i){let a=load("equipe"),x=a[i]||{};document.querySelector("#form").innerHTML='<form onsubmit="salvarEquipe(event,'+(i??-1)+')"><input name="nome" required placeholder="Nome" value="'+esc(x.nome||"")+'"><input name="funcao" placeholder="Função" value="'+esc(x.funcao||"")+'"><button>Salvar</button></form>'}
function salvarEquipe(e,i){e.preventDefault();let a=load("equipe"),o=Object.fromEntries(new FormData(e.target));i>=0?a[i]=o:a.push(o);save("equipe",a);render("equipe")}
function render(v){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===v));content.innerHTML=({painel,clientes,projetos,equipe}[v])()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>render(b.dataset.view));render("painel");
</script></body></html>
