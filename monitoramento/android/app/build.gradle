plugins {
    id 'com.android.application'
}

android {
    namespace 'net.consultoriarf.monitoramento'
    compileSdk 35

    defaultConfig {
        applicationId 'net.consultoriarf.monitoramento'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
