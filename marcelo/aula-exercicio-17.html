<style>
:root{--ink:#18243d;--muted:#5e6b80;--purple:#6344b6;--green:#13755e;--paper:#f5f6fa;--line:#e1e5ef;--pink:#d8567f}
*{box-sizing:border-box}body{margin:0;background:#eef0f7;color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,Arial,sans-serif}.wrap{max-width:1050px;margin:0 auto;padding:17px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:13px;flex-wrap:wrap}.top a{color:var(--purple);text-decoration:none;font-weight:750}.pill{background:#e9e1f8;color:var(--purple);border-radius:99px;padding:6px 12px;font-size:.85rem;font-weight:750}.player{background:white;border:1px solid var(--line);border-radius:21px;overflow:hidden;box-shadow:0 12px 32px #22315b13}.bar{background:#edeaf6;height:7px}.bar > div{background:var(--purple);height:100%;width:12.5%;transition:width .3s}.scene{padding:clamp(21px,5vw,48px);min-height:440px;display:flex;flex-direction:column;justify-content:center}.eyebrow{font-weight:800;color:var(--green);letter-spacing:.11em;text-transform:uppercase;font-size:.81rem}.scene h1{font-size:clamp(1.6rem,4vw,2.7rem);line-height:1.16;letter-spacing:-.035em;margin:15px 0 11px}.scene p{color:var(--muted);font-size:clamp(.95rem,2vw,1.2rem);margin:0 0 22px}.stage{background:#f8f6fd;border:1px solid #eee8f6;border-radius:19px;padding:20px;margin:5px 0;flex:1;min-height:210px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:15px}.math{display:flex;align-items:center;justify-content:center;gap:19px;font-size:clamp(2rem,5.5vw,4rem);font-weight:750;white-space:nowrap}.math.big{font-size:clamp(3rem,7vw,5rem);color:var(--purple)}.math.smaller{font-size:clamp(1.65rem,4vw,2.65rem)}.math b{font-weight:650}.math .unit{font-size:clamp(1.2rem,2.6vw,2rem);color:var(--ink)}.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1.1;vertical-align:middle;min-width:1.1em}.frac span:first-child{border-bottom:.055em solid currentColor;padding:0 .18em .12em;width:100%;text-align:center}.frac span:last-child{padding:.12em .18em 0;text-align:center}.ok{color:var(--green)}.highlight{background:#ebf7f1;border-radius:14px;padding:8px 18px}.hint{color:var(--muted);font-size:1.06rem;text-align:center}.boxes{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.boxes span{padding:10px 18px;border-radius:12px;background:#e8e1f8;color:var(--purple);font-weight:700}.arrow{font-size:2rem;color:var(--purple);line-height:1}.answer{background:#e7f4ee;padding:14px 19px;border-radius:12px;color:#155f4d}.tiles{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;max-width:740px;width:100%}.tile{height:clamp(24px,4vw,43px);border-radius:6px;border:1px solid #d3d8e4}.tile.left,.swatch.left{background:#22a180}.tile.used,.swatch.used{background:#df6389}.tile.empty,.swatch.empty{background:#e3e6ee}.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:.83rem;color:var(--muted)}.legend span{display:flex;gap:6px;align-items:center}.swatch{display:inline-block;height:12px;width:12px;border-radius:3px}.answers{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}.answers div{background:white;border-radius:12px;padding:14px 22px;border:1px solid #d9dfeb;min-width:210px;text-align:center}.answers div:last-child{border-color:#9cd4be;background:#e9f8f0}.answers small{display:block;color:var(--muted);font-weight:750}.answers strong{font-size:1.1rem;color:var(--green)}.captions{background:#f8f9fd;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:13px 25px;min-height:95px}.captions b{font-size:.81rem;color:var(--purple);text-transform:uppercase;letter-spacing:.09em}.captions p{margin:4px 0 0;color:#39455d}.controls{display:flex;align-items:center;gap:9px;padding:17px 20px;flex-wrap:wrap}.btn{padding:12px 15px;border-radius:10px;border:1px solid #ccd1dd;background:white;color:#26324b;font-weight:750;cursor:pointer;font:inherit}.btn:disabled{opacity:.35;cursor:default}.btn.primary{background:var(--purple);color:white;border-color:var(--purple);font-weight:750}.btn:hover:not(:disabled){filter:brightness(.95)}.options{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-left:auto}.options label{font-size:.84rem;color:var(--muted);font-weight:650}.options select{background:white;border:1px solid #cdd3df;color:var(--ink);border-radius:9px;max-width:240px;padding:8px;font:inherit;font-size:.86rem}.footnote{color:#626d7c;font-size:.83rem;margin:12px 6px}.caption-note{color:#677287;font-size:.83rem}.screenreader{position:absolute;left:-9999px} @media(max-width:600px){.wrap{padding:10px}.scene{min-height:440px}.math{gap:10px}.controls{justify-content:center;padding:13px 9px}.controls .btn{padding:11px 9px;font-size:.91rem}.options{width:100%;margin-left:0;justify-content:center}.legend{font-size:.75rem}.captions{padding:12px 16px}} 
</style>
</head><body>
<div class="wrap">
<div class="top"><a href="./exercicios-fracoes-geometria.html">← Voltar aos exercícios</a><span class="pill">Aula narrada · Matemática · 6º ano</span></div>
<div class="player">
<div class="bar"><div id="progress"></div></div>
<main class="scene" id="scene" aria-live="polite"></main>
<div class="captions"><b id="number">Passo 1 de 8</b><p id="subtitle"></p></div>
<div class="controls">
<button class="btn" id="prev" type="button">← Voltar</button>
<button class="btn primary" id="play" type="button">▶ Ouvir explicação</button>
<button class="btn" id="next" type="button">Avançar →</button>
<div class="options"><label for="voices">Voz:</label><select id="voices" aria-label="Selecione uma voz brasileira"></select><label for="rate">Ritmo:</label><select id="rate"><option value="0.88">Mais devagar</option><option value="0.96" selected>Normal</option><option value="1.08">Mais rápido</option></select></div>
</div>
</div>
<p class="footnote">A narração usa a voz em português disponível no seu navegador. No Microsoft Edge, escolha uma voz brasileira no campo “Voz” para obter a melhor qualidade. O conteúdo funciona também sem áudio.</p>
</div>
<script>
const lessons=[{"label":"Entendendo o enunciado","title":"Como dividir o papel entre 4 salas?","subtitle":"A escola recebeu uma parte de uma tonelada de papel.","html":"<div class=\"math big\"><span class=\"frac\"><span>5</span><span>6</span></span><span class=\"unit\">de tonelada</span></div><div class=\"boxes\"><span>4 salas</span><span>Divisão em partes iguais</span></div>","say":"Vamos resolver o exercício dezessete juntos. A escola recebeu cinco sextos de uma tonelada de papel, para distribuir igualmente entre quatro salas. Primeiro vamos descobrir quanto cada sala recebe."},{"label":"Letra A · Identifique a operação","title":"O total será dividido igualmente.","subtitle":"Quando dividimos em 4 partes iguais, usamos a divisão.","html":"<div class=\"math\"><span class=\"frac\"><span>5</span><span>6</span></span> <b>÷</b> <span>4</span></div><div class=\"hint\">Cinco sextos divididos entre quatro salas.</div>","say":"Na letra A, queremos saber qual quantidade cada sala vai receber. Como são quatro salas, pegamos cinco sextos e dividimos por quatro."},{"label":"Letra A · Transforme a operação","title":"Divisão de frações","subtitle":"Escreva 4 como 4 sobre 1 e inverta a segunda fração.","html":"<div class=\"math\"><span class=\"frac\"><span>5</span><span>6</span></span> <b>÷</b> <span class=\"frac\"><span>4</span><span>1</span></span></div><div class=\"arrow\">↓</div><div class=\"math highlight\"><span class=\"frac\"><span>5</span><span>6</span></span> <b>×</b> <span class=\"frac\"><span>1</span><span>4</span></span></div>","say":"Para fazer essa conta, escrevemos o número quatro como quatro sobre um. Depois, trocamos a divisão pela multiplicação e invertemos a segunda fração. Fica cinco sextos vezes um quarto."},{"label":"Letra A · Calcule","title":"Multiplique em cima e embaixo.","subtitle":"Numerador vezes numerador. Denominador vezes denominador.","html":"<div class=\"math\"><span class=\"frac\"><span>5</span><span>6</span></span> <b>×</b> <span class=\"frac\"><span>1</span><span>4</span></span> <b>=</b> <strong class=\"ok\"><span class=\"frac\"><span>5</span><span>24</span></span></strong></div><div class=\"answer\">Letra A: cada sala recebe <strong>5/24 de tonelada.</strong></div>","say":"Agora calculamos. Cinco vezes um é cinco. E seis vezes quatro é vinte e quatro. Então, cada sala recebe cinco vinte e quatro avos de tonelada. Essa é a resposta da letra A."},{"label":"Letra B · O que sobrou?","title":"Uma sala utilizou 1/8 de tonelada.","subtitle":"Retiramos o que foi usado da quantidade que a sala recebeu.","html":"<div class=\"math\"><span class=\"frac\"><span>5</span><span>24</span></span> <b>−</b> <span class=\"frac\"><span>1</span><span>8</span></span></div><div class=\"hint\">Recebeu − utilizou = restou</div>","say":"Na letra B, uma das salas utilizou um oitavo de tonelada. A sala tinha recebido cinco vinte e quatro avos de tonelada. Para descobrir quanto sobrou, precisamos subtrair."},{"label":"Letra B · Denominadores iguais","title":"Transforme 1/8 em uma fração equivalente.","subtitle":"Multiplique o numerador e o denominador por 3.","html":"<div class=\"math\"><span class=\"frac\"><span>1</span><span>8</span></span> <b>=</b> <span class=\"frac\"><span>3</span><span>24</span></span></div><div class=\"math smaller highlight\"><span class=\"frac\"><span>5</span><span>24</span></span> <b>−</b> <span class=\"frac\"><span>3</span><span>24</span></span></div>","say":"Não podemos subtrair diretamente frações com denominadores diferentes. O denominador comum é vinte e quatro. Um oitavo é o mesmo que três vinte e quatro avos. Portanto, a conta fica cinco vinte e quatro avos menos três vinte e quatro avos."},{"label":"Letra B · Visualize","title":"Das 5 partes recebidas, 3 foram usadas.","subtitle":"O desenho representa uma tonelada dividida em 24 partes iguais.","html":"<div class=\"tiles\"><div class=\"tile left\"></div><div class=\"tile left\"></div><div class=\"tile used\"></div><div class=\"tile used\"></div><div class=\"tile used\"></div><div class=\"tile empty\"></div><div class=\"tile empty\"></div><div class=\"tile empty\"></div><div class=\"tile empty\"></div><div class=\"tile empty\"></div><div class=\"tile empty\"></div><div class=\"tile empty\"></div><div class=\"tile empty\"></div><div class=\"tile empty\"></div><div class=\"tile empty\"></div><div class=\"tile empty\"></div><div class=\"tile empty\"></div><div class=\"tile empty\"></div><div class=\"tile empty\"></div><div class=\"tile empty\"></div><div class=\"tile empty\"></div><div class=\"tile empty\"></div><div class=\"tile empty\"></div><div class=\"tile empty\"></div></div><div class=\"legend\"><span><i class=\"swatch left\"></i>2 partes restantes</span><span><i class=\"swatch used\"></i>3 partes utilizadas</span><span><i class=\"swatch empty\"></i>outras partes</span></div><div class=\"math smaller\"><span class=\"frac\"><span>5</span><span>24</span></span> <b>−</b> <span class=\"frac\"><span>3</span><span>24</span></span> <b>=</b> <span class=\"frac\"><span>2</span><span>24</span></span></div>","say":"Imagine uma tonelada dividida em vinte e quatro partes iguais. A sala recebeu cinco dessas partes e utilizou três. Restaram apenas duas. Ou seja, dois vinte e quatro avos de tonelada."},{"label":"Conclusão · Simplifique","title":"Simplifique dividindo por 2.","subtitle":"O resultado final deve estar na forma simplificada.","html":"<div class=\"math\"><span class=\"frac\"><span>2</span><span>24</span></span> <b>=</b> <strong class=\"ok\"><span class=\"frac\"><span>1</span><span>12</span></span></strong></div><div class=\"answers\"><div><small>LETRA A</small><strong>5/24 de tonelada</strong></div><div><small>LETRA B</small><strong>1/12 de tonelada</strong></div></div>","say":"Para finalizar, simplificamos dois vinte e quatro avos. Dividimos o numerador e o denominador por dois. O resultado é um doze avos. Então as respostas são: letra A, cinco vinte e quatro avos de tonelada por sala. Letra B, resta um doze avos de tonelada. Muito bem!"}];
let active=0,playing=false,paused=false,utterance=null,voiceList=[],voicesReady=false;
const $=id=>document.getElementById(id);
function render(){
 const s=lessons[active];
 $('scene').innerHTML='<div class="eyebrow">'+s.label+'</div><h1>'+s.title+'</h1><p>'+s.subtitle+'</p><div class="stage">'+s.html+'</div>';
 $('number').textContent='Passo '+(active+1)+' de '+lessons.length;
 $('subtitle').textContent=s.say;
 $('progress').style.width=100*(active+1)/lessons.length+'%';
 $('prev').disabled=active===0;$('next').disabled=active===lessons.length-1;
 $('play').textContent=paused?'▶ Continuar':playing?'⏸ Pausar':'▶ Ouvir explicação';
}
function refreshVoices(){
 const all=window.speechSynthesis?window.speechSynthesis.getVoices():[];
 if(!all.length&&!voicesReady){$('voices').innerHTML='<option value="">Voz padrão do navegador</option>';return;}
 const selected=$('voices').value;
 voiceList=all.filter(v=>/pt[-_](BR|PT)|Portuguese|Português|Brazil/i.test(v.lang+' '+v.name));
 voiceList.sort((a,b)=>score(b)-score(a));
 $('voices').innerHTML='';
 if(!voiceList.length){$('voices').innerHTML='<option value="">Voz padrão do navegador</option>';}
 else voiceList.forEach((v,i)=>{const opt=document.createElement('option');opt.value=String(i);opt.textContent=v.name+' ('+v.lang+')';$('voices').appendChild(opt);});
 const same=voiceList.findIndex(v=>v.name===selected);
 if(same>=0)$('voices').value=String(same);else if(voiceList.length)$('voices').selectedIndex=0;
 voicesReady=true;
}
function score(v){const s=(v.name+' '+v.lang).toLowerCase();return (/(pt[-_]br|português.*brasil|brazil)/.test(s)?100:0)+(/natural|neural|online/.test(s)?65:0)+(/microsoft|google/.test(s)?20:0)+(/female|francisca|luciana/.test(s)?4:0);}
function stopAudio(){
 if(window.speechSynthesis)window.speechSynthesis.cancel();
 playing=false;paused=false;utterance=null;render();
}
function speak(){
 if(!('speechSynthesis' in window)){alert('Seu navegador não oferece narração automática. Experimente Microsoft Edge ou Google Chrome.');return;}
 window.speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(lessons[active].say);
 u.lang='pt-BR';u.rate=Number($('rate').value);u.pitch=1.02;u.volume=1;
 const v=voiceList[Number($('voices').value)];if(v)u.voice=v;
 const from=active;utterance=u;playing=true;paused=false;render();
 u.onend=()=>{if(utterance!==u)return; if(from<lessons.length-1){active=from+1;render();setTimeout(()=>{if(utterance===u)speak()},380);}else{playing=false;paused=false;utterance=null;render();}};
 u.onerror=e=>{if(utterance!==u)return; playing=false;paused=false;utterance=null;render();if(e.error!=='canceled'&&e.error!=='interrupted')$('subtitle').textContent+=' (Áudio indisponível no navegador; selecione outra voz.)';};
 window.speechSynthesis.speak(u);
}
$('play').addEventListener('click',()=>{
 if(!playing){speak();return;}
 if(paused){window.speechSynthesis.resume();paused=false;}else{window.speechSynthesis.pause();paused=true;}
 render();
});
function move(delta){const wasPlaying=playing;stopAudio();active=Math.max(0,Math.min(lessons.length-1,active+delta));render();if(wasPlaying)speak();}
$('prev').addEventListener('click',()=>move(-1));$('next').addEventListener('click',()=>move(1));
$('voices').addEventListener('change',()=>{if(playing)speak()});
$('rate').addEventListener('change',()=>{if(playing)speak()});
window.addEventListener('pagehide',stopAudio);
if('speechSynthesis' in window){refreshVoices();window.speechSynthesis.onvoiceschanged=refreshVoices;setTimeout(refreshVoices,650);setTimeout(refreshVoices,1800);}
render();
</script></body></html>
