<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz de Português - 6º Ano</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .quiz-container {
      background: white;
      max-width: 700px;
      width: 100%;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    h1 {
      color: #2c3e50;
      text-align: center;
      margin-bottom: 25px;
    }
    .card {
      background: #fafafa;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 20px;
    }
    .topico {
      display: inline-block;
      background: #e3f2fd;
      color: #1565c0;
      font-size: 0.85em;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 15px;
      margin-bottom: 10px;
    }
    .pergunta {
      font-size: 1.1em;
      font-weight: 600;
      margin-bottom: 15px;
    }
    .opcao {
      display: block;
      width: 100%;
      background: white;
      border: 2px solid #ddd;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 8px;
      text-align: left;
      font-size: 1em;
      cursor: pointer;
      transition: all 0.2s;
      box-sizing: border-box;
    }
    .opcao:hover {
      border-color: #2196f3;
      background: #f0f7ff;
    }
    .feedback {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.95em;
      line-height: 1.4;
    }
    .feedback.correto {
      background: #e8f5e9;
      border: 1px solid #c8e6c9;
      color: #2e7d32;
    }
    .feedback.incorreto {
      background: #fff3e0;
      border: 1px solid #ffe0b2;
      color: #e65100;
    }
    #resultado-box {
      display: none;
      background: #e8eaf6;
      border: 2px solid #3f51b5;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      margin-top: 30px;
    }
    #resultado-box h2 {
      margin-top: 0;
      color: #1a237e;
    }
    .btn-enviar {
      background-color: #2e7d32;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 1em;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 15px;
    }
    .input-aluno {
      padding: 10px;
      width: 80%;
      max-width: 300px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1em;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="quiz-container">
  <h1>Desafio de Português - 6º Ano</h1>
  
  <div style="text-align: center; margin-bottom: 20px;">
    <label for="nome-aluno"><strong>Nome do Aluno(a):</strong></label><br>
    <input type="text" id="nome-aluno" class="input-aluno" placeholder="Digite seu nome completo">
  </div>

  <div id="quiz-box"></div>

  <!-- Painel de Resultado Final -->
  <div id="resultado-box">
    <h2>Quiz Concluído! 🎉</h2>
    <p id="nota-texto" style="font-size: 1.3em; font-weight: bold;"></p>
    <button class="btn-enviar" onclick="enviarRelatorioPorEmail()">Enviar Resultado para o Professor</button>
  </div>
</div>

<script>
const EMAIL_PROFESSOR = "richard@consultoriarf.net";

const questoes = [
  {
    id: 1,
    topico: "Pronomes Retos",
    pergunta: "O Pedro estava jogando videogame e disse: 'O Pedro e o Lucas venceram a partida!'. Para não repetir os nomes e deixar a frase mais natural, como ele poderia falar?",
    opcoes: { A: "Nós vencemos a partida!", B: "Eles venceram a partida!", C: "Eu venci a partida!", D: "Vocês venceram a partida!" },
    resposta: "A",
    explicacao: "Como o Pedro faz parte do grupo (Pedro + Lucas), ele usa 'Nós'. O pronome 'Nós' serve exatamente para substituir 'eu + outra pessoa' na conversa!"
  },
  {
    id: 2,
    topico: "Pronomes Oblíquos",
    pergunta: "A Sofia achou um livro muito legal na biblioteca. Em vez de dizer 'Eu vi o livro e peguei o livro', qual é o jeito correto de juntar tudo usando um pronome?",
    opcoes: { A: "Eu vi ele e peguei ele.", B: "Eu o vi e o peguei.", C: "Eu vi si e peguei si.", D: "Eu vi consigo e peguei consigo." },
    resposta: "B",
    explicacao: "Na língua escrita, para não repetir a palavra 'livro', usamos o pronome 'o' (Eu o vi / Eu o peguei). Na fala do dia a dia a gente às vezes diz 'vi ele', mas no texto escrito o 'o' é a escolha correta!"
  },
  {
    id: 3,
    topico: "Modo Indicativo - Tempos Verbais",
    pergunta: "Imagine que você está contando para um amigo o que faz todo fim de semana. Qual das frases mostra uma ação que acontece no Presente?",
    opcoes: { A: "Eu andei de bicicleta no parque.", B: "Eu andarei de bicicleta no parque.", C: "Eu ando de bicicleta no parque.", D: "Eu andaria de bicicleta no parque." },
    resposta: "C",
    explicacao: "A palavra 'ando' mostra uma coisa que acontece no momento atual ou na sua rotina de hoje (Presente). A palavra 'andei' já passou (Passado) e 'andarei' ainda vai acontecer (Futuro)."
  },
  {
    id: 4,
    topico: "Modo Indicativo - Passado/Pretérito",
    pergunta: "O Leo estava lembrando de um aniversário antigo e disse: 'Naquele dia, nós comemos pizza e jogamos bola'. Essas ações já aconteceram e terminaram. Qual é o tempo desses verbos?",
    opcoes: { A: "Presente", B: "Pretérito Perfeito (Passado)", C: "Futuro do Presente", D: "Modo Imperativo" },
    resposta: "B",
    explicacao: "'Pretérito Perfeito' é só um nome bonito para ações do passado que foram totalmente concluídas. Como a festa já acabou e eles já comeram a pizza, os verbos estão no Pretérito Perfeito!"
  },
  {
    id: 5,
    topico: "Acentuação de Oxítonas",
    pergunta: "Você está fazendo a lista de compras para uma festa e precisa acentuar a palavra 'cafe' porque a última sílaba é a mais forte (Oxítona) e termina com a letra 'E'. Como ela deve ser escrita?",
    opcoes: { A: "Cáfe", B: "Café", C: "Cáfẽ", D: "Cafe" },
    resposta: "B",
    explicacao: "Palavras oxítonas são aquelas em que a última sílaba é falada com mais força (ca-FÉ). A regra diz que toda oxítona terminada nas letras A, E ou O deve levar acento. Por isso, escrevemos 'Café'."
  },
  {
    id: 6,
    topico: "Acentuação de Oxítonas",
    pergunta: "Qual das opções abaixo traz duas palavras que são Oxítonas e precisam de acento pelo mesmo motivo?",
    opcoes: { A: "Saci e Livro", B: "Picolé e Cipó", C: "Mesa e Cadeira", D: "Lápis e Régua" },
    resposta: "B",
    explicacao: "Nas palavras 'pico-LÉ' e 'ci-PÓ', o som mais forte está na última sílaba. Como terminam em 'E' e 'O', ambas recebem acento gráfico!"
  },
  {
    id: 7,
    topico: "Modo Imperativo",
    pergunta: "A professora entrou na sala e disse: 'Por favor, abram o livro na página 20!'. A palavra 'abram' está dando um pedido ou instrução. Qual é o modo desse verbo?",
    opcoes: { A: "Modo Indicativo (mostra uma certeza)", B: "Modo Imperativo (dá uma ordem, pedido ou conselho)", C: "Modo Passado (mostra algo que já foi feito)", D: "Modo Futuro (mostra algo que vai acontecer)" },
    resposta: "B",
    explicacao: "Usamos o 'Modo Imperativo' sempre que queremos pedir, orientar ou dar uma ordem para alguém fazer algo, exatamente como a professora fez ao pedir para abrir o livro."
  },
  {
    id: 8,
    topico: "Pronomes Retos",
    pergunta: "A Mariana e a Beatriz foram ao cinema juntas. Ao chegar em casa, a Mariana contou para a mãe: '____ assistimos a um filme incrível!'. Qual pronome reto completa a frase?",
    opcoes: { A: "Elas", B: "Nós", C: "Vós", D: "Eu" },
    resposta: "B",
    explicacao: "A Mariana estava junto no cinema, então ela se inclui no grupo. Quando a gente se inclui com outras pessoas, usamos 'Nós'."
  },
  {
    id: 9,
    topico: "Pronomes Oblíquos",
    pergunta: "O professor deu um recado importante para os alunos. Ele disse: 'Vou enviar as tarefas para vocês amanhã'. Para deixar mais curto, como ele poderia dizer?",
    opcoes: { A: "Vou enviar-lhes as tarefas amanhã.", B: "Vou enviar eles as tarefas amanhã.", C: "Vou enviar si as tarefas amanhã.", D: "Vou enviar conosco as tarefas amanhã." },
    resposta: "A",
    explicacao: "O pronome 'lhes' substitui 'para vocês' ou 'para eles'. É uma forma elegante e correta de indicar quem está recebendo a ação."
  },
  {
    id: 10,
    topico: "Modo Indicativo - Futuro",
    pergunta: "O treino de futebol foi adiado. O técnico avisou: 'Nós jogaremos a final na próxima semana'. O verbo 'jogaremos' indica algo que:",
    opcoes: { A: "Está acontecendo agora mesmo.", B: "Já aconteceu e terminou no passado.", C: "Ainda vai acontecer no futuro.", D: "É apenas um pedido ou ordem." },
    resposta: "C",
    explicacao: "A palavra 'jogaremos' está no Futuro do Presente, indicando uma ação que com certeza vai acontecer em um momento que ainda virá."
  },
  {
    id: 11,
    topico: "Acentuação de Oxítonas",
    pergunta: "Qual das opções abaixo traz uma palavra oxítona que precisa de acento porque termina com 'EM'?",
    opcoes: { A: "Também", B: "Jovem", C: "Nuvem", D: "Item" },
    resposta: "A",
    explicacao: "A regra diz que oxítonas terminadas em 'EM' ou 'ENS' recebem acento (tam-BÉM, po-RÉM, pa-ra-BÉNS). As palavras jovem, nuvem e item são paroxítonas, por isso não levam acento."
  },
  {
    id: 12,
    topico: "Modo Imperativo",
    pergunta: "Em um jogo de tabuleiro, a regra diz: 'Não olhe as cartas do seu colega de equipe!'. Essa frase está dando um aviso/proibição. Qual é o modo do verbo 'olhe'?",
    opcoes: { A: "Modo Imperativo Negativo", B: "Modo Indicativo Presente", C: "Modo Pretérito Imperfeito", D: "Modo Futuro" },
    resposta: "A",
    explicacao: "Quando usamos a palavra 'Não' junta com um verbo no Imperativo (como 'não olhe', 'não corra'), temos o Imperativo Negativo, usado para proibir ou orientar a não fazer algo."
  }
];

let respostasUsuario = {};
let respostasRespondidas = 0;
let acertos = 0;

const quizBox = document.getElementById('quiz-box');

questoes.forEach((q, idx) => {
  const card = document.createElement('div');
  card.className = 'card';
  
  let html = `<span class="topico">${q.topico}</span>`;
  html += `<div class="pergunta">${idx + 1}. ${q.pergunta}</div>`;
  
  for (let letra in q.opcoes) {
    html += `<button class="opcao" onclick="verificarResposta(${idx}, '${letra}', this)"><strong>${letra})</strong> ${q.opcoes[letra]}</button>`;
  }
  
  html += `<div id="fb-${idx}" class="feedback"></div>`;
  card.innerHTML = html;
  quizBox.appendChild(card);
});

function verificarResposta(index, letraEscolhida, elemento) {
  const q = questoes[index];
  const fbDiv = document.getElementById(`fb-${index}`);
  const card = elemento.parentElement;
  const botoes = card.querySelectorAll('.opcao');
  
  botoes.forEach(btn => btn.style.pointerEvents = 'none');
  respostasRespondidas++;
  
  const acertou = (letraEscolhida === q.resposta);
  if (acertou) acertos++;

  respostasUsuario[index] = {
    topico: q.topico,
    escolhida: letraEscolhida,
    textoEscolhida: q.opcoes[letraEscolhida],
    correta: q.resposta,
    textoCorreta: q.opcoes[q.resposta],
    acertou: acertou,
    explicacao: q.explicacao
  };
  
  if (acertou) {
    elemento.style.background = '#c8e6c9';
    elemento.style.borderColor = '#2e7d32';
    fbDiv.className = 'feedback correto';
    fbDiv.innerHTML = `<strong>Muito bem! Resposta correta (${q.resposta}).</strong><br>${q.explicacao}`;
  } else {
    elemento.style.background = '#ffcdd2';
    elemento.style.borderColor = '#c62828';
    fbDiv.className = 'feedback incorreto';
    fbDiv.innerHTML = `<strong>Opção ${letraEscolhida}. Vamos pensar juntos:</strong> A alternativa correta é a <strong>${q.resposta}</strong>.<br><br>${q.explicacao}`;
  }
  
  fbDiv.style.display = 'block';

  if (respostasRespondidas === questoes.length) {
    exibirResultadoFinal();
  }
}

function exibirResultadoFinal() {
  const total = questoes.length;
  const nota = ((acertos / total) * 10).toFixed(1);
  const resBox = document.getElementById('resultado-box');
  const notaTexto = document.getElementById('nota-texto');

  notaTexto.innerText = `Sua Nota: ${nota} / 10,0 (${acertos} de ${total} acertos)`;
  resBox.style.display = 'block';
  resBox.scrollIntoView({ behavior: 'smooth' });
}

function enviarRelatorioPorEmail() {
  const nomeAluno = document.getElementById('nome-aluno').value.trim();

  if (!nomeAluno) {
    alert("Por favor, suba até o início da página e digite o seu nome antes de enviar!");
    return;
  }

  const nota = ((acertos / questoes.length) * 10).toFixed(1);
  const assunto = encodeURIComponent(`Resultado Quiz de Português - Aluno(a): ${nomeAluno}`);
  
  let relatorio = `RESULTADO DO QUIZ DE PORTUGUÊS (6º ANO)\n`;
  relatorio += `Aluno(a): ${nomeAluno}\n`;
  relatorio += `Nota Final: ${nota} / 10,0 (${acertos} de ${questoes.length} acertos)\n\n`;
  relatorio += `===============================================\n`;
  relatorio += `DETALHAMENTO DE ERROS E ACERTOS\n`;
  relatorio += `===============================================\n\n`;

  questoes.forEach((q, idx) => {
    const r = respostasUsuario[idx];
    const status = r.acertou ? "[ACERTOU]" : "[ERROU]";
    relatorio += `Q${idx + 1} (${r.topico}): ${status}\n`;
    relatorio += `   - Marcada: (${r.escolhida}) ${r.textoEscolhida}\n`;
    relatorio += `   - Correta: (${r.correta}) ${r.textoCorreta}\n`;
    if (!r.acertou) {
      relatorio += `   - Explicação: ${r.explicacao}\n`;
    }
    relatorio += `\n`;
  });

  const corpo = encodeURIComponent(relatorio);
  window.location.href = `mailto:${EMAIL_PROFESSOR}?subject=${assunto}&body=${corpo}`;
}
</script>

</body>
</html>
