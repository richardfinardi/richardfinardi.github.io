<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz de Inglês - Unit 5: My Week</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .quiz-container {
      background: white;
      max-width: 700px;
      width: 100%;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    h1 {
      color: #2c3e50;
      text-align: center;
      margin-bottom: 5px;
    }
    p.subtitulo {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }
    .card {
      background: #fafafa;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 20px;
    }
    .topico {
      display: inline-block;
      background: #e3f2fd;
      color: #1565c0;
      font-size: 0.85em;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 15px;
      margin-bottom: 10px;
    }
    .pergunta {
      font-size: 1.05em;
      font-weight: 600;
      margin-bottom: 15px;
      line-height: 1.4;
    }
    .opcao {
      display: block;
      width: 100%;
      background: white;
      border: 2px solid #ddd;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 8px;
      text-align: left;
      font-size: 1em;
      cursor: pointer;
      transition: all 0.2s;
      box-sizing: border-box;
    }
    .opcao:hover {
      border-color: #2196f3;
      background: #f0f7ff;
    }
    .input-texto {
      width: 100%;
      padding: 12px;
      border: 2px solid #ccc;
      border-radius: 6px;
      font-size: 1em;
      box-sizing: border-box;
      margin-bottom: 10px;
    }
    .btn-responder {
      background-color: #1565c0;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.95em;
    }
    .feedback {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.95em;
      line-height: 1.4;
    }
    .feedback.correto {
      background: #e8f5e9;
      border: 1px solid #c8e6c9;
      color: #2e7d32;
    }
    .feedback.incorreto {
      background: #fff3e0;
      border: 1px solid #ffe0b2;
      color: #e65100;
    }
    #resultado-box {
      display: none;
      background: #e8eaf6;
      border: 2px solid #3f51b5;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      margin-top: 30px;
    }
    .btn-enviar {
      background-color: #2e7d32;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 1em;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 15px;
    }
    .input-aluno {
      padding: 10px;
      width: 80%;
      max-width: 300px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1em;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="quiz-container">
  <h1>English Activity - Unit 5: My Week</h1>
  <p class="subtitulo">Responda as questões abaixo (Múltipla Escolha e Digitação Curta).</p>
  
  <div style="text-align: center; margin-bottom: 20px;">
    <label for="nome-aluno"><strong>Nome do Aluno(a):</strong></label><br>
    <input type="text" id="nome-aluno" class="input-aluno" placeholder="Digite seu nome completo">
  </div>

  <div id="quiz-box"></div>

  <!-- Painel do Resultado Final -->
  <div id="resultado-box">
    <h2>Atividade Concluída! 🎉</h2>
    <p id="nota-texto" style="font-size: 1.3em; font-weight: bold;"></p>
    <button class="btn-enviar" onclick="enviarRelatorioPorEmail()">Enviar Resultado para o Professor</button>
  </div>
</div>

<script>
const EMAIL_PROFESSOR = "richard@consultoriarf.net";

const questoes = [
  {
    id: 1,
    tipo: "texto",
    topico: "Daily Routines",
    pergunta: "Como escrevemos 'almoçar' em inglês? (Digite apenas a expressão em inglês):",
    respostasAceitas: ["have lunch"],
    explicacao: "'Almoçar' em inglês é 'have lunch'."
  },
  {
    id: 2,
    tipo: "texto",
    topico: "Daily Routines",
    pergunta: "Como escrevemos 'fazer minha lição de casa' em inglês?",
    respostasAceitas: ["do my homework", "do homework"],
    explicacao: "'Fazer minha lição de casa' é 'do my homework'."
  },
  {
    id: 3,
    tipo: "opcoes",
    topico: "Chores (Tarefas Domésticas)",
    pergunta: "Qual expressão significa 'levar o lixo para fora'?",
    opcoes: {
      A: "Make my bed",
      B: "Take out the trash",
      C: "Wash the dishes",
      D: "Clear the table"
    },
    respostaCorreta: "B",
    explicacao: "'Take out the trash' significa levar o lixo para fora."
  },
  {
    id: 4,
    tipo: "opcoes",
    topico: "Chores (Tarefas Domésticas)",
    pergunta: "Qual expressão significa 'arrumar a cama'?",
    opcoes: {
      A: "Make my bed",
      B: "Clean my room",
      C: "Put away my clothes",
      D: "Dry the dishes"
    },
    respostaCorreta: "A",
    explicacao: "'Make my bed' é a forma correta para arrumar a cama."
  },
  {
    id: 5,
    tipo: "opcoes",
    topico: "Present Simple - Regra do He/She",
    pergunta: "Qual é a forma correta do verbo 'go' para a frase: 'He ____ to school by bus'?",
    opcoes: {
      A: "go",
      B: "gos",
      C: "goes",
      D: "goies"
    },
    respostaCorreta: "C",
    explicacao: "Para He, She e It, os verbos terminados em -o ganham '-es' no final (goes)."
  },
  {
    id: 6,
    tipo: "opcoes",
    topico: "Present Simple - Regra do He/She",
    pergunta: "Como fica o verbo 'wash' na frase: 'She ____ the dishes'?",
    opcoes: {
      A: "washs",
      B: "washes",
      C: "wash",
      D: "washies"
    },
    respostaCorreta: "B",
    explicacao: "Verbos terminados em -sh ganham '-es' no final quando usados com She/He/It (washes)."
  },
  {
    id: 7,
    tipo: "opcoes",
    topico: "Present Simple - Negativa",
    pergunta: "Como fazemos a frase 'I listen to rock' ficar na NEGATIVA?",
    opcoes: {
      A: "I doesn't listen to rock.",
      B: "I don't listen to rock.",
      C: "I not listen to rock.",
      D: "I no listen to rock."
    },
    respostaCorreta: "B",
    explicacao: "Para a turma do 'I, You, We, They', usamos 'don't' antes do verbo."
  },
  {
    id: 8,
    tipo: "opcoes",
    topico: "Present Simple - Negativa",
    pergunta: "Como fazemos a frase 'He cleans his room' ficar na NEGATIVA?",
    opcoes: {
      A: "He don't clean his room.",
      B: "He not cleans his room.",
      C: "He doesn't clean his room.",
      D: "He doesn't cleans his room."
    },
    respostaCorreta: "C",
    explicacao: "Para He, She e It, usamos 'doesn't' e o verbo volta para a forma normal sem o -s (clean)."
  },
  {
    id: 9,
    tipo: "opcoes",
    topico: "Preposições de Tempo",
    pergunta: "Qual preposição usamos antes dos dias da semana? Ex: '____ Mondays, I have English class.'",
    opcoes: {
      A: "In",
      B: "At",
      C: "On",
      D: "To"
    },
    respostaCorreta: "C",
    explicacao: "Usamos 'On' sempre antes de dias da semana (On Mondays, On Fridays) e finais de semana."
  },
  {
    id: 10,
    tipo: "opcoes",
    topico: "Preposições de Tempo",
    pergunta: "Qual opção completa corretamente as frases: '____ the morning' e '____ night'?",
    opcoes: {
      A: "In / At",
      B: "At / In",
      C: "On / At",
      D: "In / On"
    },
    respostaCorreta: "A",
    explicacao: "Dizemos 'In the morning' (partes do dia) e 'At night' (para a palavra night)."
  }
];

let respostasUsuario = {};
let respostasRespondidas = 0;
let acertos = 0;

const quizBox = document.getElementById('quiz-box');

questoes.forEach((q, idx) => {
  const card = document.createElement('div');
  card.className = 'card';
  
  let html = `<span class="topico">${q.topico}</span>`;
  html += `<div class="pergunta">${idx + 1}. ${q.pergunta}</div>`;
  
  if (q.tipo === "opcoes") {
    for (let letra in q.opcoes) {
      html += `<button class="opcao" onclick="responderOpcao(${idx}, '${letra}', this)"><strong>${letra})</strong> ${q.opcoes[letra]}</button>`;
    }
  } else {
    html += `<input type="text" id="input-${idx}" class="input-texto" placeholder="Digite sua resposta aqui...">`;
    html += `<button class="btn-responder" onclick="responderTexto(${idx})">Confirmar Resposta</button>`;
  }
  
  html += `<div id="fb-${idx}" class="feedback"></div>`;
  card.innerHTML = html;
  quizBox.appendChild(card);
});

function responderOpcao(index, letraEscolhida, elemento) {
  const q = questoes[index];
  const fbDiv = document.getElementById(`fb-${index}`);
  const card = elemento.parentElement;
  const botoes = card.querySelectorAll('.opcao');
  
  botoes.forEach(btn => btn.style.pointerEvents = 'none');
  respostasRespondidas++;
  
  const acertou = (letraEscolhida === q.respostaCorreta);
  if (acertou) acertos++;

  respostasUsuario[index] = {
    topico: q.topico,
    pergunta: q.pergunta,
    escolhida: `(${letraEscolhida}) ${q.opcoes[letraEscolhida]}`,
    correta: `(${q.respostaCorreta}) ${q.opcoes[q.respostaCorreta]}`,
    acertou: acertou,
    explicacao: q.explicacao
  };

  if (acertou) {
    elemento.style.background = '#c8e6c9';
    elemento.style.borderColor = '#2e7d32';
    fbDiv.className = 'feedback correto';
    fbDiv.innerHTML = `<strong>Very Good! Resposta correta (${q.respostaCorreta}).</strong><br>${q.explicacao}`;
  } else {
    elemento.style.background = '#ffcdd2';
    elemento.style.borderColor = '#c62828';
    fbDiv.className = 'feedback incorreto';
    fbDiv.innerHTML = `<strong>Você marcou a opção ${letraEscolhida}.</strong> A alternativa correta é a <strong>${q.respostaCorreta}</strong>.<br>${q.explicacao}`;
  }

  fbDiv.style.display = 'block';
  conferirFim();
}

function responderTexto(index) {
  const q = questoes[index];
  const inputEl = document.getElementById(`input-${index}`);
  const fbDiv = document.getElementById(`fb-${index}`);
  const valDigitado = inputEl.value.trim();

  if (!valDigitado) {
    alert("Por favor, digite uma resposta antes de confirmar!");
    return;
  }

  inputEl.disabled = true;
  const btn = inputEl.nextElementSibling;
  btn.disabled = true;
  btn.style.opacity = "0.5";

  respostasRespondidas++;

  const valNorm = valDigitado.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "").trim();
  const acertou = q.respostasAceitas.some(aceita => aceita.toLowerCase().trim() === valNorm);

  if (acertou) acertos++;

  respostasUsuario[index] = {
    topico: q.topico,
    pergunta: q.pergunta,
    escolhida: valDigitado,
    correta: q.respostasAceitas[0],
    acertou: acertou,
    explicacao: q.explicacao
  };

  if (acertou) {
    fbDiv.className = 'feedback correto';
    fbDiv.innerHTML = `<strong>Excelente! Resposta correta.</strong><br>${q.explicacao}`;
  } else {
    fbDiv.className = 'feedback incorreto';
    fbDiv.innerHTML = `<strong>Resposta digitada: "${valDigitado}".</strong><br><strong>Resposta esperada:</strong> ${q.respostasAceitas[0]}<br>${q.explicacao}`;
  }

  fbDiv.style.display = 'block';
  conferirFim();
}

function conferirFim() {
  if (respostasRespondidas === questoes.length) {
    const total = questoes.length;
    const nota = ((acertos / total) * 10).toFixed(1);
    const resBox = document.getElementById('resultado-box');
    const notaTexto = document.getElementById('nota-texto');

    notaTexto.innerText = `Sua Nota: ${nota} / 10,0 (${acertos} de ${total} acertos)`;
    resBox.style.display = 'block';
    resBox.scrollIntoView({ behavior: 'smooth' });
  }
}

function enviarRelatorioPorEmail() {
  const nomeAluno = document.getElementById('nome-aluno').value.trim();

  if (!nomeAluno) {
    alert("Por favor, suba até o início da página e digite o seu nome antes de enviar!");
    return;
  }

  const nota = ((acertos / questoes.length) * 10).toFixed(1);
  const assunto = encodeURIComponent(`Resultado Quiz de Inglês (Unit 5) - Aluno(a): ${nomeAluno}`);
  
  let relatorio = `RESULTADO DO QUIZ DE INGLÊS - UNIT 5 (MY WEEK)\n`;
  relatorio += `Aluno(a): ${nomeAluno}\n`;
  relatorio += `Nota Final: ${nota} / 10,0 (${acertos} de ${questoes.length} acertos)\n\n`;
  relatorio += `===============================================\n`;
  relatorio += `DETALHAMENTO DE RESPOSTAS\n`;
  relatorio += `===============================================\n\n`;

  questoes.forEach((q, idx) => {
    const r = respostasUsuario[idx];
    const status = r.acertou ? "[ACERTOU]" : "[ERROU]";
    relatorio += `Q${idx + 1} (${r.topico}): ${status}\n`;
    relatorio += `Pergunta: ${r.pergunta}\n`;
    relatorio += `• Marcada/Digitada pelo aluno: ${r.escolhida}\n`;
    relatorio += `• Resposta Correta/Gabarito: ${r.correta}\n`;
    if (!r.acertou) {
      relatorio += `• Explicação: ${r.explicacao}\n`;
    }
    relatorio += `--------------------------------------------------\n`;
  });

  const corpo = encodeURIComponent(relatorio);
  window.location.href = `mailto:${EMAIL_PROFESSOR}?subject=${assunto}&body=${corpo}`;
}
</script>

</body>
</html>
