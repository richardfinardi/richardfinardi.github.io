<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz de Inglês - Unit 5: My Week</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .quiz-container {
      background: white;
      max-width: 700px;
      width: 100%;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    h1 {
      color: #2c3e50;
      text-align: center;
      margin-bottom: 10px;
    }
    p.subtitulo {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }
    .card {
      background: #fafafa;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 20px;
    }
    .topico {
      display: inline-block;
      background: #e3f2fd;
      color: #1565c0;
      font-size: 0.85em;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 15px;
      margin-bottom: 10px;
    }
    .pergunta {
      font-size: 1.05em;
      font-weight: 600;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .resposta-input {
      width: 100%;
      padding: 10px;
      border: 2px solid #ccc;
      border-radius: 6px;
      font-size: 1em;
      box-sizing: border-box;
      margin-bottom: 10px;
    }
    .resposta-input:focus {
      border-color: #2196f3;
      outline: none;
    }
    .btn-conferir {
      background-color: #1565c0;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    .feedback {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.95em;
      line-height: 1.4;
    }
    .feedback.correto {
      background: #e8f5e9;
      border: 1px solid #c8e6c9;
      color: #2e7d32;
    }
    .feedback.incorreto {
      background: #fff3e0;
      border: 1px solid #ffe0b2;
      color: #e65100;
    }
    #resultado-box {
      display: none;
      background: #e8eaf6;
      border: 2px solid #3f51b5;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      margin-top: 30px;
    }
    .btn-enviar {
      background-color: #2e7d32;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 1em;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 15px;
    }
    .input-aluno {
      padding: 10px;
      width: 80%;
      max-width: 300px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1em;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="quiz-container">
  <h1>English Activity - Unit 5: My Week</h1>
  <p class="subtitulo">Escreva suas respostas em inglês nos campos indicados.</p>
  
  <div style="text-align: center; margin-bottom: 20px;">
    <label for="nome-aluno"><strong>Nome do Aluno(a):</strong></label><br>
    <input type="text" id="nome-aluno" class="input-aluno" placeholder="Digite seu nome completo">
  </div>

  <div id="quiz-box"></div>

  <!-- Painel do Resultado Final -->
  <div id="resultado-box">
    <h2>Atividade Concluída! 🎉</h2>
    <p id="nota-texto" style="font-size: 1.3em; font-weight: bold;"></p>
    <button class="btn-enviar" onclick="enviarRelatorioPorEmail()">Enviar Respostas para o Professor</button>
  </div>
</div>

<script>
const EMAIL_PROFESSOR = "richard@consultoriarf.net";

const questoes = [
  {
    id: 1,
    topico: "Daily Routines",
    pergunta: "Como escrevemos 'almoçar' e 'fazer minha lição de casa' em inglês?",
    respostaGabarito: ["have lunch e do my homework", "have lunch e do homework"],
    explicacao: "Almoçar é 'have lunch' e fazer lição de casa é 'do my homework'."
  },
  {
    id: 2,
    topico: "Daily Routines",
    pergunta: "Traduza para o inglês a frase: 'Eu vou para a escola de manhã'.",
    respostaGabarito: ["i go to school in the morning", "i go to school in the morning."],
    explicacao: "'Ir para a escola' é 'go to school' e 'de manhã' é 'in the morning'."
  },
  {
    id: 3,
    topico: "Chores (Tarefas Domésticas)",
    pergunta: "Escreva em inglês duas tarefas domésticas que fazemos na cozinha (ex: secar a louça, lavar a louça).",
    respostaGabarito: ["wash the dishes e dry the dishes", "wash the dishes e help with cooking", "dry the dishes e wash the dishes"],
    explicacao: "Algumas tarefas de cozinha são: 'wash the dishes' (lavar), 'dry the dishes' (secar) ou 'help with cooking' (ajudar a cozinhar)."
  },
  {
    id: 4,
    topico: "Chores (Tarefas Domésticas)",
    pergunta: "Como se diz 'arrumar a cama' e 'levar o lixo para fora' em inglês?",
    respostaGabarito: ["make my bed e take out the trash", "make the bed e take out the trash"],
    explicacao: "Arrumar a cama é 'make my bed' e levar o lixo para fora é 'take out the trash'."
  },
  {
    id: 5,
    topico: "Present Simple - Regra da 3ª Pessoa (He/She)",
    pergunta: "Complete a frase na afirmativa com o verbo correto: 'He ____ (go) to school by bus'.",
    respostaGabarito: ["goes"],
    explicacao: "Para He/She/It, verbos terminados em -o ganham -es. Por isso, 'go' vira 'goes'."
  },
  {
    id: 6,
    topico: "Present Simple - Regra da 3ª Pessoa (He/She)",
    pergunta: "Passe o verbo para a 3ª pessoa (She): Como fica 'wash' na frase 'She ____ the dishes'?",
    respostaGabarito: ["washes"],
    explicacao: "Verbos terminados em -sh ganham -es no final quando usados com He, She ou It. Logo, 'wash' vira 'washes'."
  },
  {
    id: 7,
    topico: "Present Simple - Negativa (I/You/We/They)",
    pergunta: "Escreva a frase na negativa: 'I play video games' (Use a palavra don't).",
    respostaGabarito: ["i don't play video games", "i don't play video games."],
    explicacao: "Para I, You, We e They, usamos 'don't' antes do verbo principal para fazer a negativa."
  },
  {
    id: 8,
    topico: "Present Simple - Negativa (He/She/It)",
    pergunta: "Como fica a frase 'He cleans his room' na negativa? (Dica: use doesn't e lembre do verbo voltar ao normal).",
    respostaGabarito: ["he doesn't clean his room", "he doesn't clean his room."],
    explicacao: "Para He, She e It, usamos 'doesn't' na negativa e o verbo volta para a forma normal sem o -s (clean)."
  },
  {
    id: 9,
    topico: "Preposições de Tempo (In / At / On)",
    pergunta: "Qual preposição usamos para os dias da semana? Complete: '____ Mondays, I have English class'.",
    respostaGabarito: ["on"],
    explicacao: "Usamos a preposição 'On' antes de dias da semana e finais de semana (On Mondays, On weekends)."
  },
  {
    id: 10,
    topico: "Preposições de Tempo (In / At / On)",
    pergunta: "Complete com IN ou AT: '____ the afternoon, I do my homework, but ____ night, I sleep'.",
    respostaGabarito: ["in e at", "in, at", "in / at"],
    explicacao: "Usamos 'In' para partes do dia (in the morning/afternoon/evening) e 'At' para horários específicos e para a palavra night (at night, at lunchtime)."
  }
];

let respostasUsuario = {};
let questoesConferidas = 0;
let acertos = 0;

const quizBox = document.getElementById('quiz-box');

questoes.forEach((q, idx) => {
  const card = document.createElement('div');
  card.className = 'card';
  
  let html = `<span class="topico">${q.topico}</span>`;
  html += `<div class="pergunta">${idx + 1}. ${q.pergunta}</div>`;
  html += `<input type="text" id="input-${idx}" class="resposta-input" placeholder="Digite sua resposta em inglês...">`;
  html += `<button class="btn-conferir" onclick="conferirResposta(${idx})">Conferir Resposta</button>`;
  html += `<div id="fb-${idx}" class="feedback"></div>`;
  
  card.innerHTML = html;
  quizBox.appendChild(card);
});

function normalizarTexto(txt) {
  return txt.toLowerCase().trim().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "").replace(/\s+/g, " ");
}

function conferirResposta(index) {
  const q = questoes[index];
  const inputEl = document.getElementById(`input-${index}`);
  const fbDiv = document.getElementById(`fb-${index}`);
  const valDigitado = inputEl.value;

  if (!valDigitado.trim()) {
    alert("Por favor, digite uma resposta antes de conferir!");
    return;
  }

  inputEl.disabled = true;
  const btn = inputEl.nextElementSibling;
  btn.disabled = true;
  btn.style.opacity = "0.5";

  questoesConferidas++;

  const valNorm = normalizarTexto(valDigitado);
  const acertou = q.respostaGabarito.some(gabarito => normalizarTexto(gabarito) === valNorm || valNorm.includes(normalizarTexto(gabarito)));

  if (acertou) acertos++;

  respostasUsuario[index] = {
    topico: q.topico,
    pergunta: q.pergunta,
    respostaAluno: valDigitado,
    gabaritoExemplo: q.respostaGabarito[0],
    acertou: acertou,
    explicacao: q.explicacao
  };

  if (acertou) {
    fbDiv.className = 'feedback correto';
    fbDiv.innerHTML = `<strong>Great job! Resposta correta!</strong><br>${q.explicacao}`;
  } else {
    fbDiv.className = 'feedback incorreto';
    fbDiv.innerHTML = `<strong>Resposta registrada.</strong><br><strong>Exemplo de resposta esperada:</strong> ${q.respostaGabarito[0]}<br><strong>Explicação:</strong> ${q.explicacao}`;
  }

  fbDiv.style.display = 'block';

  if (questoesConferidas === questoes.length) {
    exibirResultadoFinal();
  }
}

function exibirResultadoFinal() {
  const total = questoes.length;
  const nota = ((acertos / total) * 10).toFixed(1);
  const resBox = document.getElementById('resultado-box');
  const notaTexto = document.getElementById('nota-texto');

  notaTexto.innerText = `Sua Nota: ${nota} / 10,0 (${acertos} de ${total} acertos em equivalência)`;
  resBox.style.display = 'block';
  resBox.scrollIntoView({ behavior: 'smooth' });
}

function enviarRelatorioPorEmail() {
  const nomeAluno = document.getElementById('nome-aluno').value.trim();

  if (!nomeAluno) {
    alert("Por favor, suba até o início da página e digite o seu nome antes de enviar!");
    return;
  }

  const nota = ((acertos / questoes.length) * 10).toFixed(1);
  const assunto = encodeURIComponent(`Atividade de Inglês (Unit 5) - Aluno(a): ${nomeAluno}`);
  
  let relatorio = `ATIVIDADE DE INGLÊS - UNIT 5 (MY WEEK)\n`;
  relatorio += `Aluno(a): ${nomeAluno}\n`;
  relatorio += `Aproveitamento automático: ${nota} / 10,0\n\n`;
  relatorio += `===============================================\n`;
  relatorio += `RESPOSTAS DO ALUNO PARA CORREÇÃO\n`;
  relatorio += `===============================================\n\n`;

  questoes.forEach((q, idx) => {
    const r = respostasUsuario[idx];
    relatorio += `Q${idx + 1} (${r.topico})\n`;
    relatorio += `Pergunta: ${r.pergunta}\n`;
    relatorio += `• Resposta escrita pelo aluno: "${r.respostaAluno}"\n`;
    relatorio += `• Sugestão de Gabarito: ${r.gabaritoExemplo}\n`;
    relatorio += `• Regra/Explicação: ${r.explicacao}\n`;
    relatorio += `--------------------------------------------------\n`;
  });

  const corpo = encodeURIComponent(relatorio);
  window.location.href = `mailto:${EMAIL_PROFESSOR}?subject=${assunto}&body=${corpo}`;
}
</script>

</body>
</html>
