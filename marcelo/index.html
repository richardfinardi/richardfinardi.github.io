<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz de Inglês - Units 3 & 4</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .quiz-container {
      background: white;
      max-width: 700px;
      width: 100%;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    h1 {
      color: #2c3e50;
      text-align: center;
      margin-bottom: 5px;
    }
    p.subtitulo {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }
    .card {
      background: #fafafa;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 20px;
    }
    .topico {
      display: inline-block;
      background: #e3f2fd;
      color: #1565c0;
      font-size: 0.85em;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 15px;
      margin-bottom: 10px;
    }
    .pergunta {
      font-size: 1.05em;
      font-weight: 600;
      margin-bottom: 15px;
      line-height: 1.4;
    }
    .opcao {
      display: block;
      width: 100%;
      background: white;
      border: 2px solid #ddd;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 8px;
      text-align: left;
      font-size: 1em;
      cursor: pointer;
      transition: all 0.2s;
      box-sizing: border-box;
    }
    .opcao:hover {
      border-color: #2196f3;
      background: #f0f7ff;
    }
    .input-texto {
      width: 100%;
      padding: 12px;
      border: 2px solid #ccc;
      border-radius: 6px;
      font-size: 1em;
      box-sizing: border-box;
      margin-bottom: 10px;
    }
    .btn-responder {
      background-color: #1565c0;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.95em;
    }
    .feedback {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.95em;
      line-height: 1.4;
    }
    .feedback.correto {
      background: #e8f5e9;
      border: 1px solid #c8e6c9;
      color: #2e7d32;
    }
    .feedback.incorreto {
      background: #fff3e0;
      border: 1px solid #ffe0b2;
      color: #e65100;
    }
    #resultado-box {
      display: none;
      background: #e8eaf6;
      border: 2px solid #3f51b5;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      margin-top: 30px;
    }
    .btn-enviar {
      background-color: #2e7d32;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 1em;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 15px;
    }
    .input-aluno {
      padding: 10px;
      width: 80%;
      max-width: 300px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1em;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="quiz-container">
  <h1>English Activity - Units 3 & 4</h1>
  <p class="subtitulo">Responda as questões abaixo (Múltipla Escolha e Digitação Curta).</p>
  
  <div style="text-align: center; margin-bottom: 20px;">
    <label for="nome-aluno"><strong>Nome do Aluno(a):</strong></label><br>
    <input type="text" id="nome-aluno" class="input-aluno" placeholder="Digite seu nome completo">
  </div>

  <div id="quiz-box"></div>

  <!-- Painel do Resultado Final -->
  <div id="resultado-box">
    <h2>Atividade Concluída! 🎉</h2>
    <p id="nota-texto" style="font-size: 1.3em; font-weight: bold;"></p>
    <button class="btn-enviar" onclick="enviarRelatorioPorEmail()">Enviar Resultado para o Professor</button>
  </div>
</div>

<script>
const EMAIL_PROFESSOR = "richard@consultoriarf.net";

const questoes = [
  {
    id: 1,
    tipo: "opcoes",
    topico: "Verbo Like",
    pergunta: "Se alguém pergunta 'Do you like pop music?', qual é a resposta curta correta para SIM?",
    opcoes: {
      A: "Yes, I like.",
      B: "Yes, I do.",
      C: "Yes, I am.",
      D: "Yes, I have."
    },
    respostaCorreta: "B",
    explicacao: "Em respostas curtas em inglês não repetimos o verbo 'like'. Usamos o auxiliar 'Yes, I do'."
  },
  {
    id: 2,
    tipo: "texto",
    topico: "Demonstrativos",
    pergunta: "Qual palavra usamos para apontar para UMA coisa que está perto (singular/here)? Digite em inglês:",
    respostasAceitas: ["this"],
    explicacao: "'This' é usado para 1 coisa que está perto de nós."
  },
  {
    id: 3,
    tipo: "opcoes",
    topico: "Demonstrativos",
    pergunta: "Aponte para vários livros que estão longe de você (plural/there). Qual é a opção correta?",
    opcoes: {
      A: "This is my books.",
      B: "That is my books.",
      C: "These are my books.",
      D: "Those are my books."
    },
    respostaCorreta: "D",
    explicacao: "'Those are' é usado para indicar elementos no plural que estão longe (There)."
  },
  {
    id: 4,
    tipo: "opcoes",
    topico: "Verbo Can (Habilidade)",
    pergunta: "Qual frase está escrita de forma correta para indicar uma habilidade em inglês?",
    opcoes: {
      A: "He can swims 100 meters.",
      B: "He can swim 100 meters.",
      C: "He can to swim 100 meters.",
      D: "He cans swim 100 meters."
    },
    respostaCorreta: "B",
    explicacao: "Depois do verbo 'can', o verbo principal fica na forma normal sem 's' e sem 'to'."
  },
  {
    id: 5,
    tipo: "texto",
    topico: "Vocabulário",
    pergunta: "Como escrevemos a habilidade 'desenhar' em inglês? (Digite apenas a palavra):",
    respostasAceitas: ["draw"],
    explicacao: "'Desenhar' em inglês é 'draw'."
  },
  {
    id: 6,
    tipo: "opcoes",
    topico: "Verbo Have / Has",
    pergunta: "Qual opção completa a frase corretamente: 'She ____ two guitars and he ____ a new bike'?",
    opcoes: {
      A: "have / has",
      B: "has / have",
      C: "has / has",
      D: "have / have"
    },
    respostaCorreta: "C",
    explicacao: "Para He, She e It, usamos sempre 'has' na afirmativa."
  },
  {
    id: 7,
    tipo: "opcoes",
    topico: "Verbo Have (Negativa)",
    pergunta: "Como fica a frase 'He has a watch' na NEGATIVA?",
    opcoes: {
      A: "He don't have a watch.",
      B: "He doesn't has a watch.",
      C: "He doesn't have a watch.",
      D: "He hasn't a watch."
    },
    respostaCorreta: "C",
    explicacao: "Na negativa de He/She/It usamos 'doesn't' e o verbo volta para a forma base 'have'."
  },
  {
    id: 8,
    tipo: "opcoes",
    topico: "Modo Imperativo",
    pergunta: "Como damos um aviso ou proibição usando o Imperativo? (Ex: 'Não corra!')",
    opcoes: {
      A: "No run!",
      B: "Not run!",
      C: "Don't run!",
      D: "Doesn't run!"
    },
    respostaCorreta: "C",
    explicacao: "No imperativo negativo usamos 'Don't' antes do verbo."
  },
  {
    id: 9,
    tipo: "texto",
    topico: "Plural Irregular",
    pergunta: "Qual é o plural da palavra 'child' (criança) em inglês? (Digite apenas a palavra no plural):",
    respostasAceitas: ["children"],
    explicacao: "O plural de 'child' é irregular: 'children'."
  },
  {
    id: 10,
    tipo: "opcoes",
    topico: "Conectores (And / But)",
    pergunta: "Qual opção completa a frase corretamente: 'I like shopping, ____ I don't have money.'?",
    opcoes: {
      A: "and",
      B: "but",
      C: "because",
      D: "or"
    },
    respostaCorreta: "B",
    explicacao: "Usamos 'but' (mas) para conectar ideias contrárias/opostas."
  }
];

let respostasUsuario = {};
let respostasRespondidas = 0;
let acertos = 0;

const quizBox = document.getElementById('quiz-box');

questoes.forEach((q, idx) => {
  const card = document.createElement('div');
  card.className = 'card';
  
  let html = `<span class="topico">${q.topico}</span>`;
  html += `<div class="pergunta">${idx + 1}. ${q.pergunta}</div>`;
  
  if (q.tipo === "opcoes") {
    for (let letra in q.opcoes) {
      html += `<button class="opcao" onclick="responderOpcao(${idx}, '${letra}', this)"><strong>${letra})</strong> ${q.opcoes[letra]}</button>`;
    }
  } else {
    html += `<input type="text" id="input-${idx}" class="input-texto" placeholder="Digite sua resposta em inglês...">`;
    html += `<button class="btn-responder" onclick="responderTexto(${idx})">Confirmar Resposta</button>`;
  }
  
  html += `<div id="fb-${idx}" class="feedback"></div>`;
  card.innerHTML = html;
  quizBox.appendChild(card);
});

function responderOpcao(index, letraEscolhida, elemento) {
  const q = questoes[index];
  const fbDiv = document.getElementById(`fb-${index}`);
  const card = elemento.parentElement;
  const botoes = card.querySelectorAll('.opcao');
  
  botoes.forEach(btn => btn.style.pointerEvents = 'none');
  respostasRespondidas++;
  
  const acertou = (letraEscolhida === q.respostaCorreta);
  if (acertou) acertos++;

  respostasUsuario[index] = {
    topico: q.topico,
    pergunta: q.pergunta,
    escolhida: `(${letraEscolhida}) ${q.opcoes[letraEscolhida]}`,
    correta: `(${q.respostaCorreta}) ${q.opcoes[q.respostaCorreta]}`,
    acertou: acertou,
    explicacao: q.explicacao
  };

  if (acertou) {
    elemento.style.background = '#c8e6c9';
    elemento.style.borderColor = '#2e7d32';
    fbDiv.className = 'feedback correto';
    fbDiv.innerHTML = `<strong>Very Good! Resposta correta (${q.respostaCorreta}).</strong><br>${q.explicacao}`;
  } else {
    elemento.style.background = '#ffcdd2';
    elemento.style.borderColor = '#c62828';
    fbDiv.className = 'feedback incorreto';
    fbDiv.innerHTML = `<strong>Você marcou a opção ${letraEscolhida}.</strong> A alternativa correta é a <strong>${q.respostaCorreta}</strong>.<br>${q.explicacao}`;
  }

  fbDiv.style.display = 'block';
  conferirFim();
}

function responderTexto(index) {
  const q = questoes[index];
  const inputEl = document.getElementById(`input-${index}`);
  const fbDiv = document.getElementById(`fb-${index}`);
  const valDigitado = inputEl.value.trim();

  if (!valDigitado) {
    alert("Por favor, digite uma resposta antes de confirmar!");
    return;
  }

  inputEl.disabled = true;
  const btn = inputEl.nextElementSibling;
  btn.disabled = true;
  btn.style.opacity = "0.5";

  respostasRespondidas++;

  const valNorm = valDigitado.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "").trim();
  const acertou = q.respostasAceitas.some(aceita => aceita.toLowerCase().trim() === valNorm);

  if (acertou) acertos++;

  respostasUsuario[index] = {
    topico: q.topico,
    pergunta: q.pergunta,
    escolhida: valDigitado,
    correta: q.respostasAceitas[0],
    acertou: acertou,
    explicacao: q.explicacao
  };

  if (acertou) {
    fbDiv.className = 'feedback correto';
    fbDiv.innerHTML = `<strong>Excelente! Resposta correta.</strong><br>${q.explicacao}`;
  } else {
    fbDiv.className = 'feedback incorreto';
    fbDiv.innerHTML = `<strong>Resposta digitada: "${valDigitado}".</strong><br><strong>Resposta esperada:</strong> ${q.respostasAceitas[0]}<br>${q.explicacao}`;
  }

  fbDiv.style.display = 'block';
  conferirFim();
}

function conferirFim() {
  if (respostasRespondidas === questoes.length) {
    const total = questoes.length;
    const nota = ((acertos / total) * 10).toFixed(1);
    const resBox = document.getElementById('resultado-box');
    const notaTexto = document.getElementById('nota-texto');

    notaTexto.innerText = `Sua Nota: ${nota} / 10,0 (${acertos} de ${total} acertos)`;
    resBox.style.display = 'block';
    resBox.scrollIntoView({ behavior: 'smooth' });
  }
}

function enviarRelatorioPorEmail() {
  const nomeAluno = document.getElementById('nome-aluno').value.trim();

  if (!nomeAluno) {
    alert("Por favor, suba até o início da página e digite o seu nome antes de enviar!");
    return;
  }

  const nota = ((acertos / questoes.length) * 10).toFixed(1);
  const assunto = encodeURIComponent(`Resultado Quiz de Inglês (Units 3 e 4) - Aluno(a): ${nomeAluno}`);
  
  let relatorio = `RESULTADO DO QUIZ DE INGLÊS - UNITS 3 & 4\n`;
  relatorio += `Aluno(a): ${nomeAluno}\n`;
  relatorio += `Nota Final: ${nota} / 10,0 (${acertos} de ${questoes.length} acertos)\n\n`;
  relatorio += `===============================================\n`;
  relatorio += `DETALHAMENTO DE RESPOSTAS\n`;
  relatorio += `===============================================\n\n`;

  questoes.forEach((q, idx) => {
    const r = respostasUsuario[idx];
    const status = r.acertou ? "[ACERTOU]" : "[ERROU]";
    relatorio += `Q${idx + 1} (${r.topico}): ${status}\n`;
    relatorio += `Pergunta: ${r.pergunta}\n`;
    relatorio += `• Marcada/Digitada pelo aluno: ${r.escolhida}\n`;
    relatorio += `• Resposta Correta/Gabarito: ${r.correta}\n`;
    if (!r.acertou) {
      relatorio += `• Explicação: ${r.explicacao}\n`;
    }
    relatorio += `--------------------------------------------------\n`;
  });

  const corpo = encodeURIComponent(relatorio);
  window.location.href = `mailto:${EMAIL_PROFESSOR}?subject=${assunto}&body=${corpo}`;
}
</script>

</body>
</html>
