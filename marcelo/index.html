<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Quizzes - 6º Ano</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
      color: #333;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      background: white;
      max-width: 750px;
      width: 100%;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    h1 {
      color: #1a237e;
      text-align: center;
      margin-bottom: 10px;
    }
    p.subtitulo {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }
    
    /* MENU PRINCIPAL */
    #menu-principal {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 20px;
    }
    .btn-quiz-menu {
      padding: 18px;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 1.15em;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-quiz-menu:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .btn-portugues { background-color: #0288d1; }
    .btn-ingles1 { background-color: #388e3c; }
    .btn-ingles2 { background-color: #f57c00; }
    .btn-espanhol { background-color: #d32f2f; }

    /* ESTILOS DOS QUIZZES */
    .quiz-secao {
      display: none;
    }
    .btn-voltar {
      background-color: #757575;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .card {
      background: #fafafa;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 20px;
    }
    .topico {
      display: inline-block;
      background: #e3f2fd;
      color: #1565c0;
      font-size: 0.85em;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 15px;
      margin-bottom: 10px;
    }
    .pergunta {
      font-size: 1.05em;
      font-weight: 600;
      margin-bottom: 15px;
      line-height: 1.4;
    }
    .opcao {
      display: block;
      width: 100%;
      background: white;
      border: 2px solid #ddd;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 8px;
      text-align: left;
      font-size: 1em;
      cursor: pointer;
      transition: all 0.2s;
      box-sizing: border-box;
    }
    .opcao:hover {
      border-color: #2196f3;
      background: #f0f7ff;
    }
    .input-texto {
      width: 100%;
      padding: 12px;
      border: 2px solid #ccc;
      border-radius: 6px;
      font-size: 1em;
      box-sizing: border-box;
      margin-bottom: 10px;
    }
    .btn-responder {
      background-color: #1565c0;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .feedback {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.95em;
      line-height: 1.4;
    }
    .feedback.correto {
      background: #e8f5e9;
      border: 1px solid #c8e6c9;
      color: #2e7d32;
    }
    .feedback.incorreto {
      background: #fff3e0;
      border: 1px solid #ffe0b2;
      color: #e65100;
    }
    .resultado-box {
      display: none;
      background: #e8eaf6;
      border: 2px solid #3f51b5;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      margin-top: 30px;
    }
    .btn-enviar {
      background-color: #2e7d32;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 1em;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 15px;
    }
    .input-aluno {
      padding: 10px;
      width: 80%;
      max-width: 300px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1em;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- ================= MENU PRINCIPAL ================= -->
  <div id="menu-principal">
    <h1>Portal de Estudo e Desafios 🚀</h1>
    <p class="subtitulo">Escolha uma matéria abaixo para começar o teste:</p>
    
    <button class="btn-quiz-menu btn-portugues" onclick="abrirQuiz('portugues')">
      <span>📚 Quiz de Português (6º Ano)</span> <span>➜</span>
    </button>

    <button class="btn-quiz-menu btn-ingles1" onclick="abrirQuiz('ingles1')">
      <span>🇬🇧 Quiz de Inglês (Unit 5 - My Week)</span> <span>➜</span>
    </button>

    <button class="btn-quiz-menu btn-ingles2" onclick="abrirQuiz('ingles2')">
      <span>🇬🇧 Quiz de Inglês (Units 3 & 4)</span> <span>➜</span>
    </button>

    <button class="btn-quiz-menu btn-espanhol" onclick="abrirQuiz('espanhol')">
      <span>🇪🇸 Quiz de Espanhol (Unidades 3, 5 + Caderno)</span> <span>➜</span>
    </button>
  </div>

  <!-- ================= CONTAINER DOS QUIZZES ================= -->
  <div id="area-quiz" style="display: none;">
    <button class="btn-voltar" onclick="voltarAoMenu()">⬅ Voltar ao Menu Principal</button>
    
    <div style="text-align: center; margin-bottom: 20px;">
      <label for="nome-aluno"><strong>Nome do Aluno(a):</strong></label><br>
      <input type="text" id="nome-aluno" class="input-aluno" placeholder="Digite seu nome completo">
    </div>

    <div id="conteudo-quiz"></div>

    <div id="resultado-box" class="resultado-box">
      <h2>Atividade Concluída! 🎉</h2>
      <p id="nota-texto" style="font-size: 1.3em; font-weight: bold;"></p>
      <button class="btn-enviar" onclick="enviarRelatorioPorEmail()">Enviar Resultado para o Professor</button>
    </div>
  </div>

</div>

<script>
const EMAIL_PROFESSOR = "richard@consultoriarf.net";

// BANCO DE DADOS DOS QUIZZES
const bancoQuizzes = {
  portugues: {
    titulo: "Quiz de Português - 6º Ano",
    questoes: [
      { tipo: "opcoes", topico: "Pronomes Retos", pergunta: "O Pedro estava jogando videogame e disse: 'O Pedro e o Lucas venceram a partida!'. Como trocar os nomes por um pronome?", opcoes: { A: "Nós vencemos a partida!", B: "Eles venceram a partida!", C: "Eu venci a partida!", D: "Vocês venceram a partida!" }, respostaCorreta: "A", explicacao: "Como o Pedro se inclui no grupo, ele usa 'Nós'." },
      { tipo: "opcoes", topico: "Pronomes Oblíquos", pergunta: "Em vez de dizer 'Eu vi o livro e peguei o livro', qual é o jeito correto de juntar tudo?", opcoes: { A: "Eu vi ele e peguei ele.", B: "Eu o vi e o peguei.", C: "Eu vi si e peguei si.", D: "Eu vi consigo e peguei consigo." }, respostaCorreta: "B", explicacao: "Substituímos 'o livro' pelo pronome 'o' na norma culta." },
      { tipo: "opcoes", topico: "Tempos Verbais", pergunta: "Qual frase mostra uma ação no Presente?", opcoes: { A: "Eu andei de bicicleta.", B: "Eu andarei de bicicleta.", C: "Eu ando de bicicleta.", D: "Eu andaria de bicicleta." }, respostaCorreta: "C", explicacao: "'Ando' indica uma ação que acontece no momento presente." },
      { tipo: "opcoes", topico: "Pretérito Perfeito", pergunta: "O Leo disse: 'Naquele dia, nós comemos pizza e jogamos bola'. Essas ações foram concluídas. Qual o tempo verbal?", opcoes: { A: "Presente", B: "Pretérito Perfeito (Passado)", C: "Futuro do Presente", D: "Imperativo" }, respostaCorreta: "B", explicacao: "Ações concluídas no passado ficam no Pretérito Perfeito." },
      { tipo: "opcoes", topico: "Acentuação Oxítonas", pergunta: "A palavra 'café' precisa de acento porque é oxítona e termina com qual letra?", opcoes: { A: "Termina em A", B: "Termina em E", C: "Termina em O", D: "Termina em EM" }, respostaCorreta: "B", explicacao: "Oxítonas terminadas em A, E, O levam acento gráfico." },
      { tipo: "opcoes", topico: "Acentuação Oxítonas", pergunta: "Qual opção traz duas palavras oxítonas acentuadas pela mesma regra?", opcoes: { A: "Saci e Livro", B: "Picolé e Cipó", C: "Mesa e Cadeira", D: "Lápis e Régua" }, respostaCorreta: "B", explicacao: "Picolé e Cipó são oxítonas terminadas em E e O." },
      { tipo: "opcoes", topico: "Modo Imperativo", pergunta: "A professora disse: 'Por favor, abram o livro na página 20!'. Qual é o modo do verbo?", opcoes: { A: "Modo Indicativo", B: "Modo Imperativo", C: "Modo Subjuntivo", D: "Modo Futuro" }, respostaCorreta: "B", explicacao: "O Imperativo expressa ordem, pedido ou orientação." },
      { tipo: "opcoes", topico: "Pronomes Retos", pergunta: "'Mariana e Beatriz foram ao cinema. Mariana disse: ____ assistimos a um filme incrível!'. Complete:", opcoes: { A: "Elas", B: "Nós", C: "Vós", D: "Eu" }, respostaCorreta: "B", explicacao: "Mariana estava incluída na ação, por isso usa 'Nós'." },
      { tipo: "opcoes", topico: "Pronomes Oblíquos", pergunta: "Para encurtar 'Vou enviar as tarefas para vocês amanhã', o professor pode dizer:", opcoes: { A: "Vou enviar-lhes as tarefas amanhã.", B: "Vou enviar eles as tarefas amanhã.", C: "Vou enviar si as tarefas amanhã.", D: "Vou enviar conosco as tarefas." }, respostaCorreta: "A", explicacao: "O pronome 'lhes' substitui 'para vocês/eles'." },
      { tipo: "opcoes", topico: "Modo Indicativo - Futuro", pergunta: "O verbo 'jogaremos' na frase 'Nós jogaremos a final' indica algo que:", opcoes: { A: "Acontece agora.", B: "Terminou no passado.", C: "Ainda vai acontecer no futuro.", D: "É uma proibição." }, respostaCorreta: "C", explicacao: "'Jogaremos' é Futuro do Presente." },
      { tipo: "opcoes", topico: "Acentuação Oxítonas", pergunta: "Qual oxítona precisa de acento por terminar em 'EM'?", opcoes: { A: "Também", B: "Jovem", C: "Nuvem", D: "Item" }, respostaCorreta: "A", explicacao: "Oxítonas terminadas em EM/ENS são acentuadas (Também, Porém)." },
      { tipo: "opcoes", topico: "Modo Imperativo Negativo", pergunta: "'Não olhe as cartas do colega!'. A palavra 'Não' junto com o verbo forma o:", opcoes: { A: "Imperativo Negativo", B: "Indicativo Presente", C: "Pretérito Imperfeito", D: "Futuro" }, respostaCorreta: "A", explicacao: "Proibição com a palavra 'Não' forma o Imperativo Negativo." }
    ]
  },
  ingles1: {
    titulo: "Quiz de Inglês - Unit 5: My Week",
    questoes: [
      { tipo: "texto", topico: "Daily Routines", pergunta: "Como escrevemos 'almoçar' em inglês? (Digite apenas a expressão):", respostasAceitas: ["have lunch"], explicacao: "'Almoçar' é 'have lunch'." },
      { tipo: "texto", topico: "Daily Routines", pergunta: "Como escrevemos 'fazer minha lição de casa' em inglês?", respostasAceitas: ["do my homework", "do homework"], explicacao: "'Fazer lição de casa' é 'do my homework'." },
      { tipo: "opcoes", topico: "Chores", pergunta: "Qual expressão significa 'levar o lixo para fora'?", opcoes: { A: "Make my bed", B: "Take out the trash", C: "Wash the dishes", D: "Clear the table" }, respostaCorreta: "B", explicacao: "'Take out the trash' é levar o lixo para fora." },
      { tipo: "opcoes", topico: "Chores", pergunta: "Qual expressão significa 'arrumar a cama'?", opcoes: { A: "Make my bed", B: "Clean my room", C: "Put away my clothes", D: "Dry the dishes" }, respostaCorreta: "A", explicacao: "'Make my bed' significa arrumar a cama." },

      { tipo: "opcoes", topico: "Present Simple Negativa", pergunta: "Passe a frase para a negativa: 'I listen to rock'.", opcoes: { A: "I doesn't listen to rock.", B: "I don't listen to rock.", C: "I not listen to rock.", D: "I no listen to rock." }, respostaCorreta: "B", explicacao: "Usamos 'don't' para I, You, We e They." },
      { tipo: "opcoes", topico: "Present Simple Negativa", pergunta: "Passe a frase para a negativa: 'He cleans his room'.", opcoes: { A: "He don't clean his room.", B: "He not cleans his room.", C: "He doesn't clean his room.", D: "He doesn't cleans his room." }, respostaCorreta: "C", explicacao: "Usamos 'doesn't' e o verbo volta ao normal (clean)." },
      { tipo: "opcoes", topico: "Preposições de Tempo", pergunta: "Qual preposição usamos com dias da semana? '____ Mondays, I study'.", opcoes: { A: "In", B: "At", C: "On", D: "To" }, respostaCorreta: "C", explicacao: "Usamos 'On' para dias da semana (On Mondays)." },
      { tipo: "opcoes", topico: "Preposições de Tempo", pergunta: "Complete: '____ the morning' e '____ night'.", opcoes: { A: "In / At", B: "At / In", C: "On / At", D: "In / On" }, respostaCorreta: "A", explicacao: "Dizemos 'In the morning' e 'At night'." }
    ]
  },
  ingles2: {
    titulo: "Quiz de Inglês - Units 3 & 4",
    questoes: [
      { tipo: "opcoes", topico: "Verbo Like", pergunta: "Qual é a resposta curta correta para 'Do you like pop music?' (SIM)?", opcoes: { A: "Yes, I like.", B: "Yes, I do.", C: "Yes, I am.", D: "Yes, I have." }, respostaCorreta: "B", explicacao: "Usamos o auxiliar 'Yes, I do'." },
      { tipo: "texto", topico: "Demonstrativos", pergunta: "Palavra usada para apontar 1 coisa que está perto (singular/here). Digite em inglês:", respostasAceitas: ["this"], explicacao: "'This' é usado para 1 coisa perto." },
      { tipo: "opcoes", topico: "Demonstrativos", pergunta: "Aponte para vários livros que estão longe (plural/there):", opcoes: { A: "This is my books.", B: "That is my books.", C: "These are my books.", D: "Those are my books." }, respostaCorreta: "D", explicacao: "'Those are' é plural e longe." },
      { tipo: "opcoes", topico: "Verbo Can", pergunta: "Qual frase sobre habilidade está gramaticalmente correta?", opcoes: { A: "He can swims 100 meters.", B: "He can swim 100 meters.", C: "He can to swim 100 meters.", D: "He cans swim 100 meters." }, respostaCorreta: "B", explicacao: "Após 'can' o verbo fica na forma base (swim)." },
      { tipo: "texto", topico: "Vocabulário", pergunta: "Como se diz a habilidade 'desenhar' em inglês?", respostasAceitas: ["draw"], explicacao: "'Desenhar' em inglês é 'draw'." },
      { tipo: "opcoes", topico: "Have / Has", pergunta: "Complete: 'She ____ two guitars and he ____ a new bike'.", opcoes: { A: "have / has", B: "has / have", C: "has / has", D: "have / have" }, respostaCorreta: "C", explicacao: "Usamos 'has' para He e She." },
      { tipo: "opcoes", topico: "Have Negativa", pergunta: "Como fica 'He has a watch' na NEGATIVA?", opcoes: { A: "He don't have a watch.", B: "He doesn't has a watch.", C: "He doesn't have a watch.", D: "He hasn't a watch." }, respostaCorreta: "C", explicacao: "Na negativa usamos 'doesn't have'." },
      { tipo: "opcoes", topico: "Imperativo", pergunta: "Como damos uma ordem de proibição? ('Não corra!')", opcoes: { A: "No run!", B: "Not run!", C: "Don't run!", D: "Doesn't run!" }, respostaCorreta: "C", explicacao: "Imperativo negativo usa 'Don't'." },
      { tipo: "texto", topico: "Plural Irregular", pergunta: "Digite o plural da palavra 'child' (criança) em inglês:", respostasAceitas: ["children"], explicacao: "O plural irregular de 'child' é 'children'." },
      { tipo: "opcoes", topico: "Conectores", pergunta: "Complete: 'I like shopping, ____ I don't have money.'", opcoes: { A: "and", B: "but", C: "because", D: "or" }, respostaCorreta: "B", explicacao: "Usamos 'but' (mas) para indicar contraste." }

  },
  espanhol: {
    titulo: "Quiz de Espanhol - Unidades 3, 5 e Caderno",
    questoes: [
      { tipo: "texto", topico: "Objetos Escolares", pergunta: "¿Cómo se llama el objeto que 'sirve para borrar si nos equivocamos'? Digite em espanhol:", respostasAceitas: ["la goma", "goma"], explicacao: "'La goma' é a borracha em espanhol." },

      { tipo: "opcoes", topico: "Cambio Vocálico (e->i)", pergunta: "Como fica a conjugação do verbo 'Pedir' na frase: 'Yo ____ un consejo'?", opcoes: { A: "Pedo", B: "Pido", C: "Pede", D: "Pedimos" }, respostaCorreta: "B", explicacao: "A vogal 'e' muda para 'i': Yo pido." },

    ]
  }
};

let quizAtual = null;
let respostasUsuario = {};
let respostasRespondidas = 0;
let acertos = 0;

function abrirQuiz(chave) {
  quizAtual = bancoQuizzes[chave];
  respostasUsuario = {};
  respostasRespondidas = 0;
  acertos = 0;

  document.getElementById('menu-principal').style.display = 'none';
  document.getElementById('area-quiz').style.display = 'block';
  document.getElementById('resultado-box').style.display = 'none';

  const container = document.getElementById('conteudo-quiz');
  container.innerHTML = `<h2>${quizAtual.titulo}</h2>`;

  quizAtual.questoes.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    
    let html = `<span class="topico">${q.topico}</span>`;
    html += `<div class="pergunta">${idx + 1}. ${q.pergunta}</div>`;
    
    if (q.tipo === "opcoes") {
      for (let letra in q.opcoes) {
        html += `<button class="opcao" onclick="responderOpcao(${idx}, '${letra}', this)"><strong>${letra})</strong> ${q.opcoes[letra]}</button>`;
      }
    } else {
      html += `<input type="text" id="input-${idx}" class="input-texto" placeholder="Digite sua resposta...">`;
      html += `<button class="btn-responder" onclick="responderTexto(${idx})">Confirmar Resposta</button>`;
    }
    
    html += `<div id="fb-${idx}" class="feedback"></div>`;
    card.innerHTML = html;
    container.appendChild(card);
  });
}

function responderOpcao(index, letraEscolhida, elemento) {
  const q = quizAtual.questoes[index];
  const fbDiv = document.getElementById(`fb-${index}`);
  const card = elemento.parentElement;
  const botoes = card.querySelectorAll('.opcao');
  
  botoes.forEach(btn => btn.style.pointerEvents = 'none');
  respostasRespondidas++;
  
  const acertou = (letraEscolhida === q.respostaCorreta);
  if (acertou) acertos++;

  respostasUsuario[index] = {
    topico: q.topico,
    pergunta: q.pergunta,
    escolhida: `(${letraEscolhida}) ${q.opcoes[letraEscolhida]}`,
    correta: `(${q.respostaCorreta}) ${q.opcoes[q.respostaCorreta]}`,
    acertou: acertou,
    explicacao: q.explicacao
  };

  if (acertou) {
    elemento.style.background = '#c8e6c9';
    elemento.style.borderColor = '#2e7d32';
    fbDiv.className = 'feedback correto';
    fbDiv.innerHTML = `<strong>Muito bem! Resposta correta (${q.respostaCorreta}).</strong><br>${q.explicacao}`;
  } else {
    elemento.style.background = '#ffcdd2';
    elemento.style.borderColor = '#c62828';
    fbDiv.className = 'feedback incorreto';
    fbDiv.innerHTML = `<strong>Você marcou ${letraEscolhida}.</strong> A alternativa correta é <strong>${q.respostaCorreta}</strong>.<br>${q.explicacao}`;
  }

  fbDiv.style.display = 'block';
  conferirFim();
}

function responderTexto(index) {
  const q = quizAtual.questoes[index];
  const inputEl = document.getElementById(`input-${index}`);
  const fbDiv = document.getElementById(`fb-${index}`);
  const valDigitado = inputEl.value.trim();

  if (!valDigitado) {
    alert("Por favor, digite uma resposta antes de confirmar!");
    return;
  }

  inputEl.disabled = true;
  const btn = inputEl.nextElementSibling;
  btn.disabled = true;
  btn.style.opacity = "0.5";

  respostasRespondidas++;

  const valNorm = valDigitado.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "").trim();
  const acertou = q.respostasAceitas.some(aceita => aceita.toLowerCase().trim() === valNorm);

  if (acertou) acertos++;

  respostasUsuario[index] = {
    topico: q.topico,
    pergunta: q.pergunta,
    escolhida: valDigitado,
    correta: q.respostasAceitas[0],
    acertou: acertou,
    explicacao: q.explicacao
  };

  if (acertou) {
    fbDiv.className = 'feedback correto';
    fbDiv.innerHTML = `<strong>Excelente! Resposta correta.</strong><br>${q.explicacao}`;
  } else {
    fbDiv.className = 'feedback incorreto';
    fbDiv.innerHTML = `<strong>Resposta digitada: "${valDigitado}".</strong><br><strong>Esperado:</strong> ${q.respostasAceitas[0]}<br>${q.explicacao}`;
  }

  fbDiv.style.display = 'block';
  conferirFim();
}

function conferirFim() {
  if (respostasRespondidas === quizAtual.questoes.length) {
    const total = quizAtual.questoes.length;
    const nota = ((acertos / total) * 10).toFixed(1);
    const resBox = document.getElementById('resultado-box');
    const notaTexto = document.getElementById('nota-texto');

    notaTexto.innerText = `Sua Nota: ${nota} / 10,0 (${acertos} de ${total} acertos)`;
    resBox.style.display = 'block';
    resBox.scrollIntoView({ behavior: 'smooth' });
  }
}

function voltarAoMenu() {
  document.getElementById('area-quiz').style.display = 'none';
  document.getElementById('menu-principal').style.display = 'flex';
}

function enviarRelatorioPorEmail() {
  const nomeAluno = document.getElementById('nome-aluno').value.trim();

  if (!nomeAluno) {
    alert("Por favor, digite seu nome completo no campo do topo antes de enviar!");
    return;
  }

  const nota = ((acertos / quizAtual.questoes.length) * 10).toFixed(1);
  const assunto = encodeURIComponent(`Resultado: ${quizAtual.titulo} - Aluno(a): ${nomeAluno}`);
  
  let relatorio = `RELATÓRIO DE ATIVIDADE - ${quizAtual.titulo.toUpperCase()}\n`;
  relatorio += `Aluno(a): ${nomeAluno}\n`;
  relatorio += `Nota Final: ${nota} / 10,0 (${acertos} de ${quizAtual.questoes.length} acertos)\n\n`;
  relatorio += `===============================================\n`;
  relatorio += `DETALHAMENTO DAS RESPOSTAS\n`;
  relatorio += `===============================================\n\n`;

  quizAtual.questoes.forEach((q, idx) => {
    const r = respostasUsuario[idx];
    const status = r.acertou ? "[ACERTOU]" : "[ERROU]";
    relatorio += `Q${idx + 1} (${r.topico}): ${status}\n`;
    relatorio += `Pergunta: ${r.pergunta}\n`;
    relatorio += `• Marcada/Digitada: ${r.escolhida}\n`;
    relatorio += `• Resposta Correta: ${r.correta}\n`;
    if (!r.acertou) {
      relatorio += `• Explicação: ${r.explicacao}\n`;
    }
    relatorio += `--------------------------------------------------\n`;
  });

  const corpo = encodeURIComponent(relatorio);
  window.location.href = `mailto:${EMAIL_PROFESSOR}?subject=${assunto}&body=${corpo}`;
}
</script>
