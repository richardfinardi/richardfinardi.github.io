let quizAtual = null;
let respostasUsuario = {};
let respostasRespondidas = 0;
let acertos = 0;

// Função auxiliar para normalizar texto prevenindo erros de digitação e acentos
function normalizarTexto(str) {
  return str.toString()
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "") // Remove acentos
            .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "") // Remove pontuação
            .replace(/\s+/g, "") // Remove todos os espaços em branco
            .trim();
}

function abrirQuiz(chave) {
  quizAtual = bancoQuizzes[chave];
  respostasUsuario = {};
  respostasRespondidas = 0;
  acertos = 0;

  document.getElementById('menu-principal').style.display = 'none';
  document.getElementById('area-quiz').style.display = 'block';
  document.getElementById('resultado-box').style.display = 'none';

  const container = document.getElementById('conteudo-quiz');
  container.innerHTML = `<h2>${quizAtual.titulo}</h2>`;

  quizAtual.questoes.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    
    let html = `<span class="topico">${q.topico}</span>`;
    html += `<div class="pergunta">${idx + 1}. ${q.pergunta}</div>`;
    
    if (q.tipo === "opcoes") {
      for (let letra in q.opcoes) {
        html += `<button class="opcao" onclick="responderOpcao(${idx}, '${letra}', this)"><strong>${letra})</strong> ${q.opcoes[letra]}</button>`;
      }
    } else {
      html += `<input type="text" id="input-${idx}" class="input-texto" placeholder="Digite sua resposta...">`;
      html += `<button class="btn-responder" onclick="responderTexto(${idx})">Confirmar Resposta</button>`;
    }
    
    html += `<div id="fb-${idx}" class="feedback"></div>`;
    card.innerHTML = html;
    container.appendChild(card);
  });
}

function responderOpcao(index, letraEscolhida, elemento) {
  const q = quizAtual.questoes[index];
  const fbDiv = document.getElementById(`fb-${index}`);
  const card = elemento.parentElement;
  const botoes = card.querySelectorAll('.opcao');
  
  botoes.forEach(btn => btn.style.pointerEvents = 'none');
  respostasRespondidas++;
  
  const acertou = (letraEscolhida === q.respostaCorreta);
  if (acertou) acertos++;

  respostasUsuario[index] = {
    topico: q.topico,
    pergunta: q.pergunta,
    escolhida: `(${letraEscolhida}) ${q.opcoes[letraEscolhida]}`,
    correta: `(${q.respostaCorreta}) ${q.opcoes[q.respostaCorreta]}`,
    acertou: acertou,
    explicacao: q.explicacao
  };

  if (acertou) {
    elemento.style.background = '#c8e6c9';
    elemento.style.borderColor = '#2e7d32';
    fbDiv.className = 'feedback correto';
    fbDiv.innerHTML = `<strong>Muito bem! Resposta correta (${q.respostaCorreta}).</strong><br>${q.explicacao}`;
  } else {
    elemento.style.background = '#ffcdd2';
    elemento.style.borderColor = '#c62828';
    fbDiv.className = 'feedback incorreto';
    fbDiv.innerHTML = `<strong>Você marcou ${letraEscolhida}.</strong> A alternativa correta é <strong>${q.respostaCorreta}</strong>.<br>${q.explicacao}`;
  }

  fbDiv.style.display = 'block';
  conferirFim();
}

function responderTexto(index) {
  const q = quizAtual.questoes[index];
  const inputEl = document.getElementById(`input-${index}`);
  const fbDiv = document.getElementById(`fb-${index}`);
  const valDigitado = inputEl.value.trim();

  if (!valDigitado) {
    alert("Por favor, digite uma resposta antes de confirmar!");
    return;
  }

  inputEl.disabled = true;
  const btn = inputEl.nextElementSibling;
  btn.disabled = true;
  btn.style.opacity = "0.5";

  respostasRespondidas++;

  const valNorm = normalizarTexto(valDigitado);
  const acertou = q.respostasAceitas.some(aceita => normalizarTexto(aceita) === valNorm);

  if (acertou) acertos++;

  respostasUsuario[index] = {
    topico: q.topico,
    pergunta: q.pergunta,
    escolhida: valDigitado,
    correta: q.respostasAceitas[0],
    acertou: acertou,
    explicacao: q.explicacao
  };

  if (acertou) {
    fbDiv.className = 'feedback correto';
    fbDiv.innerHTML = `<strong>Excelente! Resposta correta.</strong><br>${q.explicacao}`;
  } else {
    fbDiv.className = 'feedback incorreto';
    fbDiv.innerHTML = `<strong>Resposta digitada: "${valDigitado}".</strong><br><strong>Esperado:</strong> ${q.respostasAceitas[0]}<br>${q.explicacao}`;
  }

  fbDiv.style.display = 'block';
  conferirFim();
}

function conferirFim() {
  if (respostasRespondidas === quizAtual.questoes.length) {
    const total = quizAtual.questoes.length;
    const nota = ((acertos / total) * 10).toFixed(1);
    const resBox = document.getElementById('resultado-box');
    const notaTexto = document.getElementById('nota-texto');

    notaTexto.innerText = `Sua Nota: ${nota} / 10,0 (${acertos} de ${total} acertos)`;
    resBox.style.display = 'block';
    resBox.scrollIntoView({ behavior: 'smooth' });
  }
}

function voltarAoMenu() {
  document.getElementById('area-quiz').style.display = 'none';
  document.getElementById('menu-principal').style.display = 'flex';
}

function enviarRelatorioPorEmail() {
  const nomeAluno = document.getElementById('nome-aluno').value.trim();

  if (!nomeAluno) {
    alert("Por favor, digite seu nome completo no campo do topo antes de enviar!");
    return;
  }

  const nota = ((acertos / quizAtual.questoes.length) * 10).toFixed(1);
  const assunto = encodeURIComponent(`Resultado: ${quizAtual.titulo} - Aluno(a): ${nomeAluno}`);
  
  let relatorio = `RELATÓRIO DE ATIVIDADE - ${quizAtual.titulo.toUpperCase()}\n`;
  relatorio += `Aluno(a): ${nomeAluno}\n`;
  relatorio += `Nota Final: ${nota} / 10,0 (${acertos} de ${quizAtual.questoes.length} acertos)\n\n`;
  relatorio += `===============================================\n`;
  relatorio += `DETALHAMENTO DAS RESPOSTAS\n`;
  relatorio += `===============================================\n\n`;

  quizAtual.questoes.forEach((q, idx) => {
    const r = respostasUsuario[idx];
    const status = r.acertou ? "[ACERTOU]" : "[ERROU]";
    relatorio += `Q${idx + 1} (${r.topico}): ${status}\n`;
    relatorio += `Pergunta: ${r.pergunta}\n`;
    relatorio += `• Marcada/Digitada: ${r.escolhida}\n`;
    relatorio += `• Resposta Correta: ${r.correta}\n`;
    if (!r.acertou) {
      relatorio += `• Explicação: ${r.explicacao}\n`;
    }
    relatorio += `--------------------------------------------------\n`;
  });

  const corpo = encodeURIComponent(relatorio);
  window.location.href = `mailto:${EMAIL_PROFESSOR}?subject=${assunto}&body=${corpo}`;
}
