<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONSULTORIA.RF | Gestão & Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: { primary: '#FF8838', hover: '#e07024', dark: '#0d0d0f', card: '#16161a', border: '#242429', muted: '#9ea0a6' }
            }
          }
        }
      }
    </script>
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0d0d0f; color: #f4f4f5; }</style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- CABEÇALHO -->
    <header class="border-b border-brand-border bg-[#0d0d0f]/95 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <span class="text-xl font-bold tracking-wider text-white">CONSULTORIA<span class="text-brand-primary">.RF</span></span>
            <span id="role-badge" class="hidden text-xs bg-brand-primary/10 text-brand-primary border border-brand-primary/30 px-2.5 py-1 rounded-full font-bold uppercase"></span>
        </div>
        <div id="user-menu" class="hidden flex items-center gap-4">
            <span class="text-sm text-brand-muted"><strong class="text-white" id="user-display-name"></strong></span>
            <button onclick="deslogar()" class="text-xs bg-red-950/50 border border-red-800/50 hover:bg-red-900 text-red-200 px-3 py-1.5 rounded-lg transition font-semibold">Sair</button>
        </div>
    </header>

    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="flex-1 flex items-center justify-center p-4">
        <div class="bg-brand-card p-8 rounded-2xl border border-brand-border w-full max-w-md space-y-6 shadow-2xl">
            <div class="text-center space-y-2">
                <h1 class="text-2xl font-bold text-white">Acesso ao Sistema</h1>
                <p class="text-brand-muted text-sm">Insira suas credenciais cadastradas na planilha</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs uppercase font-bold text-brand-muted mb-1">E-mail</label>
                    <input type="email" id="login-email" class="w-full p-3 rounded-lg bg-[#0d0d0f] border border-brand-border text-white text-sm focus:border-brand-primary outline-none">
                </div>
                <div>
                    <label class="block text-xs uppercase font-bold text-brand-muted mb-1">Senha</label>
                    <input type="password" id="login-password" class="w-full p-3 rounded-lg bg-[#0d0d0f] border border-brand-border text-white text-sm focus:border-brand-primary outline-none">
                </div>
                <button onclick="fazerLogin()" class="w-full bg-brand-primary hover:bg-brand-hover text-white font-bold py-3 rounded-lg transition text-sm">
                    Entrar
                </button>
            </div>
        </div>
    </div>

    <!-- NAVEGAÇÃO INTERNA -->
    <nav id="app-nav" class="hidden bg-[#121215] border-b border-brand-border px-6 py-2 flex gap-4 text-sm">
        <button id="nav-admin" onclick="trocarAba('admin')" class="px-3 py-1.5 rounded-md font-semibold bg-brand-primary text-white">Painel Admin</button>
        <button id="nav-dash" onclick="trocarAba('dash')" class="px-3 py-1.5 rounded-md font-semibold text-brand-muted hover:text-white">Dashboard</button>
    </nav>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-1 p-6 max-w-7xl mx-auto w-full">
        
        <!-- SEÇÃO ADMIN (CADASTROS) -->
        <div id="screen-admin" class="hidden space-y-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                
                <!-- Cadastrar Cliente -->
                <div class="bg-brand-card p-6 rounded-xl border border-brand-border space-y-4">
                    <h2 class="text-lg font-bold text-white">Cadastrar Novo Cliente (Empresa)</h2>
                    <div class="space-y-3">
                        <input type="text" id="cli-id" placeholder="ID do Cliente (ex: CLI01)" class="w-full p-2.5 rounded bg-[#0d0d0f] border border-brand-border text-sm text-white">
                        <input type="text" id="cli-nome" placeholder="Nome / Razão Social" class="w-full p-2.5 rounded bg-[#0d0d0f] border border-brand-border text-sm text-white">
                        <input type="text" id="cli-cnpj" placeholder="CNPJ" class="w-full p-2.5 rounded bg-[#0d0d0f] border border-brand-border text-sm text-white">
                        <button onclick="cadastrarCliente()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded text-sm">Salvar Cliente</button>
                    </div>
                </div>

                <!-- Cadastrar Usuário -->
                <div class="bg-brand-card p-6 rounded-xl border border-brand-border space-y-4">
                    <h2 class="text-lg font-bold text-white">Cadastrar Usuário</h2>
                    <div class="space-y-3">
                        <input type="text" id="usr-cli-id" placeholder="ID do Cliente Vinc. (ex: CLI01 ou ADMIN)" class="w-full p-2.5 rounded bg-[#0d0d0f] border border-brand-border text-sm text-white">
                        <input type="text" id="usr-id" placeholder="ID do Usuário (ex: USR01)" class="w-full p-2.5 rounded bg-[#0d0d0f] border border-brand-border text-sm text-white">
                        <input type="text" id="usr-nome" placeholder="Nome Completo" class="w-full p-2.5 rounded bg-[#0d0d0f] border border-brand-border text-sm text-white">
                        <input type="email" id="usr-email" placeholder="E-mail" class="w-full p-2.5 rounded bg-[#0d0d0f] border border-brand-border text-sm text-white">
                        <input type="text" id="usr-celular" placeholder="Celular" class="w-full p-2.5 rounded bg-[#0d0d0f] border border-brand-border text-sm text-white">
                        <input type="password" id="usr-senha" placeholder="Senha de Acesso" class="w-full p-2.5 rounded bg-[#0d0d0f] border border-brand-border text-sm text-white">
                        <button onclick="cadastrarUsuario()" class="w-full bg-brand-primary hover:bg-brand-hover text-white font-bold py-2.5 rounded text-sm">Salvar Usuário</button>
                    </div>
                </div>

            </div>
        </div>

        <!-- SEÇÃO DASHBOARD (ÁREA CLIENTE) -->
        <div id="screen-dash" class="hidden space-y-6">
            <h2 class="text-xl font-bold text-white">Área Restrita do Cliente</h2>
            <div class="bg-brand-card p-6 rounded-xl border border-brand-border">
                <p class="text-brand-muted">Bem-vindo ao portal. Dados sincronizados com o Google Sheets.</p>
            </div>
        </div>

    </main>

    <script>
        // SUBSTITUA PELA URL GERADA NA IMPLANTAÇÃO DO GOOGLE APPS SCRIPT
        const API_URL = "https://script.google.com/macros/s/AKfycbwLQ07C51AHB64HS7PJ7vfD99CKuZy-ubfewbXgN4e15enkfCUU6EzhafHU_zZXAPKL/exec";

        let currentUser = null;

        async function fazerLogin() {
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-password').value.trim();

            if(!email || !pass) return alert("Preencha e-mail e senha.");

            try {
                const res = await fetch(`${API_URL}?action=TUSUARIO`);
                const usuarios = await res.json();
                
                // Validação comparando com a tabela TUSUARIO
                const user = usuarios.find(u => 
                    String(u.TUSUARIO_EMAIL).toLowerCase() === email.toLowerCase() && 
                    String(u.TUSUARIO_SENHA) === pass &&
                    String(u.TUSUARIO_ATIVO).toUpperCase() === 'SIM'
                );

                if(!user) {
                    return alert("Usuário não encontrado, inativo ou senha incorreta.");
                }

                currentUser = user;
                iniciarSessao();
            } catch(e) {
                alert("Erro ao conectar com a base de dados.");
                console.error(e);
            }
        }

        function iniciarSessao() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('user-menu').classList.remove('hidden');
            document.getElementById('app-nav').classList.remove('hidden');
            document.getElementById('user-display-name').innerText = currentUser.TUSUARIO_NOME;

            const isAdmin = currentUser.TCLIENTE_ID === 'ADMIN';
            const badge = document.getElementById('role-badge');
            
            badge.innerText = isAdmin ? "ADMINISTRADOR" : "PORTAL DO CLIENTE";
            badge.classList.remove('hidden');

            if(!isAdmin) {
                document.getElementById('nav-admin').classList.add('hidden');
                trocarAba('dash');
            } else {
                document.getElementById('nav-admin').classList.remove('hidden');
                trocarAba('admin');
            }
        }

        function trocarAba(aba) {
            document.getElementById('screen-admin').classList.add('hidden');
            document.getElementById('screen-dash').classList.add('hidden');
            
            if(aba === 'admin') document.getElementById('screen-admin').classList.remove('hidden');
            if(aba === 'dash') document.getElementById('screen-dash').classList.remove('hidden');
        }

        async function cadastrarCliente() {
            const data = [
                document.getElementById('cli-id').value,
                document.getElementById('cli-nome').value,
                document.getElementById('cli-cnpj').value
            ];

            const payload = { sheet: "TCLIENTE", data: data };

            await fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            alert("Solicitação de cadastro de cliente enviada com sucesso!");
        }

        async function cadastrarUsuario() {
            const data = [
                document.getElementById('usr-cli-id').value,
                document.getElementById('usr-id').value,
                document.getElementById('usr-nome').value,
                document.getElementById('usr-email').value,
                document.getElementById('usr-celular').value,
                document.getElementById('usr-senha').value,
                "SIM" // TUSUARIO_ATIVO por padrão
            ];

            const payload = { sheet: "TUSUARIO", data: data };

            await fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            alert("Solicitação de cadastro de usuário enviada com sucesso!");
        }

        function deslogar() {
            location.reload();
        }
    </script>
</body>
</html>
